function fmtHr(h){
  h=((h%24)+24)%24;
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
}

function baroFam(technique){
  const t=String(technique).toLowerCase();
  if(t.startsWith("streamer")||t.startsWith("swung")||t.startsWith("wet fly")) return "swing";
  if(t.includes("nymph")||t.startsWith("tight-line")) return "deep";
  return "surf";
}

/* ============================================================
   3b. DIARY — what the angler saw, and what that tells the engine

   Everything above this line is modeled: seasonal curves, hatch
   calendars, averages taken across a whole region. The diary is
   the one input that is not. A day on the river is a measurement
   OF that river, and once there are a few of them the book knows
   things the model never will — that the Hendricksons run a week
   late in this pool, that the fish here only ever come to a swung
   wet, that high-and-green is when the streamer day happens.

   A logged day speaks for the dates around it, on the water it
   was logged on, and it speaks louder when the river looks the
   way it looked that day. Its influence is bounded on purpose,
   the same way the barometer's is: a handful of days is evidence,
   not proof, and the angler should never have to argue with their
   own notebook to see what the water is doing right now.
   ============================================================ */

const DIARY_KEY = "riffle.diary.v1";
const DIARY_MAX = 400;        // entries kept — the oldest fall off the back
const MEM_DAYS  = 21;         // ± days of calendar a logged day speaks for
const MEM_MILES = 12;         // how far away a logged day still counts as here
const MEM_MAX   = 0.15;       // hardest a full book may push one play's score
const MEM_HATCH_MAX = 0.30;   // ...and one hatch's intensity
const MEM_STRETCH = 12;       // days a sighting may stretch a hatch window

/* The six ways a fly gets fished, and the plays each one covers.
   The angler logs a method; the engine ranks plays. */
const METHODS = [
  {k:"dry",        label:"Dry fly",           plays:["hatch-dry","spinner","terrestrial","sight"]},
  {k:"drydropper", label:"Dry-dropper",       plays:["drydropper"]},
  {k:"nymph",      label:"Nymph under an indicator", plays:["indicator","midge","gl-indicator","highwater","crustacean"]},
  {k:"tightline",  label:"Euro / tight-line", plays:["euro","gl-tightline"]},
  {k:"swing",      label:"Wet fly / swung fly", plays:["wetswing","gl-swing"]},
  {k:"streamer",   label:"Streamer",          plays:["streamer","gl-streamer","mouse"]},
];
const METHOD_OF_PLAY = (()=>{ const m={}; METHODS.forEach(x=>x.plays.forEach(k=>m[k]=x.k)); return m; })();
const METHOD_BY_KEY  = (()=>{ const m={}; METHODS.forEach(x=>m[x.k]=x); return m; })();

/* How the day went. This is the only field the engine truly
   needs — everything else refines it. */
const OUTCOMES = [
  {k:"blank",  label:"Blank",  v:-1.0,  short:"blank"},
  {k:"slow",   label:"Slow",   v:-0.35, short:"slow"},
  {k:"steady", label:"Steady", v:0.55,  short:"steady"},
  {k:"hot",    label:"Hot",    v:1.0,   short:"hot"},
];
const OUTCOME_BY_KEY = (()=>{ const m={}; OUTCOMES.forEach(o=>m[o.k]=o); return m; })();

const isoLocal = (d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtISO(iso){
  const [y,m,d]=iso.split("-").map(Number);
  return `${d} ${MON[m-1]} ${y}`;
}
function dayOfISO(iso){ const [y,m,d]=iso.split("-").map(Number); return doy(new Date(y,m-1,d)); }
/* The calendar wraps: 28 December is nine days from 6 January. */
function doyGap(a,b){ const d=Math.abs(a-b); return Math.min(d, 366-d); }

/* --- the store ----------------------------------------------
   localStorage throws outright in a sandboxed frame and in some
   private modes, so every touch is guarded. A browser that will
   not store the diary still runs the app; it just cannot carry
   today's observations into next time, and says so.
------------------------------------------------------------ */
function diaryUsable(){
  try{ const k="riffle.probe"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
function validEntry(e){
  return !!e && typeof e==="object"
      && typeof e.date==="string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date)
      && !!OUTCOME_BY_KEY[e.outcome];
}
function normEntry(e){
  return {
    id: e.id || ("d"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
    date: e.date,
    waterId: e.waterId || null,
    hatchKey: e.hatchKey || null,
    water: e.water || "Unnamed water",
    place: e.place || "",
    lat: isFinite(e.lat) ? e.lat : null,
    lon: isFinite(e.lon) ? e.lon : null,
    outcome: e.outcome,
    methods: Array.isArray(e.methods) ? e.methods.filter(k=>METHOD_BY_KEY[k]) : [],
    hatches: Array.isArray(e.hatches) ? e.hatches.filter(id=>HATCHES.some(h=>h.id===id)) : [],
    flies: String(e.flies||"").slice(0,240),
    notes: String(e.notes||"").slice(0,2000),
    cond: {
      flow:    e.cond && FLOW_STATES.some(f=>f.k===e.cond.flow) ? e.cond.flow : null,
      clarity: e.cond && CLARITY[e.cond.clarity] ? e.cond.clarity : null,
      sky:     e.cond && ["bright","partly","overcast"].includes(e.cond.sky) ? e.cond.sky : null,
    },
    temp: isFinite(e.temp) ? e.temp : null,
    cfs:  isFinite(e.cfs)  ? e.cfs  : null,
  };
}
function diaryLoad(){
  try{
    const raw = localStorage.getItem(DIARY_KEY);
    if(!raw) return [];
    const j = JSON.parse(raw);
    if(!Array.isArray(j)) return [];
    return j.filter(validEntry).map(normEntry).sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ return []; }        // junk in the slot is not worth a broken app
}
function diarySave(){
  try{
    state.diary = state.diary.sort((a,b)=>b.date.localeCompare(a.date)).slice(0, DIARY_MAX);
    localStorage.setItem(DIARY_KEY, JSON.stringify(state.diary));
    return true;
  }catch(e){ return false; }     // quota, or a browser that will not store
}

/* --- how much a past day counts for today -------------------- */

/* Same water, or near enough that the same bugs come off it. */
function placeWeight(e, w){
  const key = hatchKeyOf(w);
  if(e.hatchKey && key && e.hatchKey===key) return 1;
  if(e.waterId && w.id && e.waterId===w.id) return 1;
  if(e.lat!=null && e.lon!=null && isFinite(w.lat) && isFinite(w.lon)){
    const mi = haversine(e.lat, e.lon, w.lat, w.lon);
    if(mi<=1) return 1;
    if(mi<=MEM_MILES) return clamp(1-(mi-1)/MEM_MILES, 0.2, 1);
  }
  return 0;
}
/* Place × season × age × how well the river matches that day. */
function entryWeight(e, ctx){
  const place = placeWeight(e, ctx.w);
  if(place<=0) return 0;
  const gap = doyGap(dayOfISO(e.date), ctx.day);
  if(gap>MEM_DAYS) return 0;
  const season = Math.exp(-Math.pow(gap/(MEM_DAYS*0.62), 2));      // the same week counts most
  const years  = Math.max(0, ctx.d.getFullYear() - Number(e.date.slice(0,4)));
  const age    = 1/(1+0.22*years);          // last spring still matters, it just matters less
  let cond = 1;
  if(e.cond){
    if(e.cond.flow    && e.cond.flow===ctx.fs.k)         cond *= 1.35;
    if(e.cond.clarity && e.cond.clarity===ctx.clarity.k) cond *= 1.20;
    if(e.cond.sky     && e.cond.sky===ctx.sky)           cond *= 1.10;
  }
  return place*season*age*cond;
}

/* --- what the book says about right now ---------------------- */
function verdictOf(ev){
  if(ev>=0.62) return "hot";
  if(ev>=0.20) return "well";
  if(ev>-0.20) return "either way";
  if(ev>-0.62) return "slow";
  return "blank";
}
function recall(ctx){
  const empty = {days:0, rows:[], tech:{}, hatch:{}, stored:state.diaryOK};
  if(!state.diary.length) return empty;

  const rows=[];
  for(const e of state.diary){
    const w = entryWeight(e, ctx);
    if(w>0.02) rows.push({e, w});
  }
  if(!rows.length) return empty;
  rows.sort((a,b)=>b.w-a.w);

  /* Methods. A method not tried on a day is not evidence about
     that method — only the ones the angler actually fished score. */
  const acc={};
  for(const {e,w} of rows){
    const v = OUTCOME_BY_KEY[e.outcome].v;
    for(const k of e.methods){
      const a = acc[k] || (acc[k]={sum:0, val:0, days:0});
      a.sum += w; a.val += w*v; a.days++;
    }
  }
  const tech={};
  for(const [k,a] of Object.entries(acc)){
    const ev   = a.sum ? a.val/a.sum : 0;
    const conf = 1-Math.exp(-a.sum/1.6);          // one day nudges, five days lean
    const mult = clamp(1 + MEM_MAX*ev*conf, 1-MEM_MAX, 1+MEM_MAX);
    tech[k] = {k, label:METHOD_BY_KEY[k].label, days:a.days, ev, conf, mult,
               verdict:verdictOf(ev), pct:Math.round((mult-1)*100)};
  }

  /* Hatches. A sighting is a sighting whether or not the fish ate,
     so these are weighted by the day, never by the outcome. */
  const hacc={};
  for(const {e,w} of rows) for(const id of e.hatches) hacc[id]=(hacc[id]||0)+w;
  const hatch={};
  for(const [id,sum] of Object.entries(hacc)){
    const seen = 1-Math.exp(-sum/1.2);
    hatch[id] = {id, seen, mult: 1+MEM_HATCH_MAX*seen};
  }

  return {days:rows.length, rows, tech, hatch, stored:state.diaryOK};
}

function recommend(ctx){
  const ah=activeHatches(ctx), runs=activeRuns(ctx);
  /* Every play reads a hatch, a species or a seasonal curve, and out
     here Riffle has none of the three. A guess would be indistinguishable
     from a reading, which is the one thing this app must not produce. */
  if(ctx.outOfBook) return {picked:[], ah, runs};
  let out=[];
  for(const p of PLAYS){
    let r=null;
    try{ r=p.build(ctx,ah,runs); }catch(e){ r=null; }
    if(r && isFinite(r.score)) out.push(Object.assign({key:p.key},r));
  }
  // barometer: a differential nudge, never more than +/-8%
  const bw=(ctx.baro&&ctx.baro.w)||{};
  out.forEach(p=>{ p.score *= (bw[baroFam(p.technique)] || 1); });
  // the diary: bounded the same way, and only where the book has days
  if(ctx.mem && ctx.mem.days){
    out.forEach(p=>{
      const m = ctx.mem.tech[METHOD_OF_PLAY[p.key]];
      if(m){ p.score *= m.mult; p.mem = m; }
    });
  }
  out.sort((a,b)=>b.score-a.score);
  // keep the top three, preferring distinct techniques
  const picked=[], seen=new Set();
  for(const p of out){
    const fam=p.technique.split("—")[0].trim();
    if(seen.has(fam)&&picked.length<3&&out.length>4) continue;
    seen.add(fam); picked.push(p);
    if(picked.length===3) break;
  }
  while(picked.length<3&&out.length>picked.length){
    const nxt=out.find(p=>!picked.includes(p)); if(!nxt) break; picked.push(nxt);
  }
  const max=picked.length?picked[0].score:1;
  picked.forEach((p,i)=>{ p.rank=i+1; p.conf=Math.round(clamp(48+ (p.score/Math.max(max,1))*47, 30, 96)); });
  /* `all` is every play that scored, in order. Only three are ever shown,
     but whether the book moved a play is a question about its score, not
     about whether it happened to make the card this week. */
  return {picked, all:out, ah, runs};
}

/* ============================================================
   4. LIVE GAUGE (works when the page can reach the network)
   ============================================================ */
async function tryLive(gauge){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),4500);
    const url=`https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${gauge}&parameterCd=00060,00010&siteStatus=all`;
    const res=await fetch(url,{signal:c.signal}); clearTimeout(t);
    if(!res.ok) return null;
    const j=await res.json();
    let cfs=null, tempC=null;
    for(const ts of (j.value?.timeSeries||[])){
      const code=ts.variable?.variableCode?.[0]?.value;
      const v=parseFloat(ts.values?.[0]?.value?.[0]?.value);
      if(!isFinite(v)||v<=-999) continue;
      if(code==="00060") cfs=v;
      if(code==="00010") tempC=v;
    }
    if(cfs==null&&tempC==null) return null;
    return {gauge, cfs, tempF: tempC==null?null:Math.round((tempC*9/5+32)*10)/10, at:new Date()};
  }catch(e){ return null; }
}

/* Open-Meteo needs no key. Blocked by CSP in some embeds, in which
   case we fall back to the angler's own read of the sky. */
async function tryBaro(lat, lon){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),4500);
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}`
            + `&hourly=surface_pressure&past_days=1&forecast_days=1&timezone=auto`;
    const res=await fetch(url,{signal:c.signal}); clearTimeout(t);
    if(!res.ok) return null;
    const j=await res.json();
    const times=j.hourly?.time||[], vals=j.hourly?.surface_pressure||[];
    if(times.length!==vals.length || !times.length) return null;
    const now=Date.now();
    let i=-1;
    for(let k=0;k<times.length;k++){
      if(!isFinite(vals[k])||vals[k]==null) continue;
      if(new Date(times[k]).getTime()<=now) i=k; else break;
    }
    if(i<3) return null;
    const hPa=vals[i], prev=vals[i-3];
    if(!isFinite(hPa)||!isFinite(prev)) return null;
    const hist=vals.slice(Math.max(0,i-6), i+1).filter(v=>isFinite(v));
    return {lat, lon, hPa, delta3h: hPa-prev, hist, at:new Date()};
  }catch(e){ return null; }
}

/* one round trip for everything the network can tell us */
async function refreshLive(w){
  const [live, baro] = await Promise.all([tryLive(w.gauge), tryBaro(w.lat, w.lon)]);
  let changed=false;
  if(live){ state.live=live; changed=true; }
  if(baro){ state.baro=baro; changed=true; }
  if(changed) draw();
}

/* ============================================================
   4b. WHERE — address, map pin, public access points

   The engine above only ever asks water() for one object. So a
   spot the angler picks off the map is answered with an object
   of exactly that shape: seasonal curves borrowed from the
   nearest water in the book, flow bands rescaled by drainage
   area, and a live gauge of its own. Everything downstream —
   plays, shop list, hatch, access ladder — runs unchanged.
   ============================================================ */

const NOMINATIM = "https://nominatim.openstreetmap.org";
const OVERPASS  = ["https://overpass-api.de/api/interpreter",
                   "https://overpass.kumi.systems/api/interpreter"];

/* --- kinds of access, best first ---------------------------
   OSM tags say what a thing IS, never who may stand on it.
   Ranking reflects how likely a feature is to be a genuine
   put-in; the UI never claims any of them is legal access.
------------------------------------------------------------ */
const ACCESS_KINDS = {
  slipway:   {label:"Boat launch",     pri:0, hint:"ramp or slipway"},
  fishing:   {label:"Fishing access",  pri:0, hint:"mapped as fishing access"},
  pier:      {label:"Pier or dock",    pri:1, hint:"structure over the water"},
  trailhead: {label:"Trailhead",       pri:1, hint:"foot access"},
  parking:   {label:"Parking",         pri:2, hint:"lot within walking distance of the water"},
};
const PRIVATE_ACCESS = /^(private|no|customers|permit|permissive)$/i;
const PARK_MAX_M = 400;      // a lot further than this from water is not access

function kindOf(tags){
  if(!tags) return null;
  if(tags.leisure==="slipway")   return "slipway";
  if(tags.leisure==="fishing")   return "fishing";
  if(tags.man_made==="pier")     return "pier";
  if(tags.highway==="trailhead") return "trailhead";
  if(tags.amenity==="parking")   return "parking";
  return null;
}

/* metres between two lat/lons — the display helper works in miles */
function metres(a,b,c,d){
  const R=6371000, rad=Math.PI/180;
  const dLat=(c-a)*rad, dLon=(d-b)*rad;
  const s=Math.sin(dLat/2)**2 + Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

async function withTimeout(url, opts, ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms||9000);
  try{ return await fetch(url, Object.assign({signal:c.signal}, opts||{})); }
  finally{ clearTimeout(t); }
}

/* --- geocoding ---------------------------------------------- */
async function geocode(q){
  const url=`${NOMINATIM}/search?format=jsonv2&limit=6&countrycodes=us&q=${encodeURIComponent(q)}`;
  const res=await withTimeout(url, null, 9000);
  if(!res.ok) throw new Error("geocoder "+res.status);
  const j=await res.json();
  return (j||[]).map(r=>({
    label: r.display_name,
    short: (r.display_name||"").split(",").slice(0,3).join(",").trim(),
    lat: parseFloat(r.lat), lon: parseFloat(r.lon),
  })).filter(r=>isFinite(r.lat)&&isFinite(r.lon));
}

async function reverseGeocode(lat, lon){
  try{
    const url=`${NOMINATIM}/reverse?format=jsonv2&zoom=14&lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}`;
    const res=await withTimeout(url, null, 8000);
    if(!res.ok) return null;
    const j=await res.json();
    if(!j || !j.display_name) return null;
    return j.display_name.split(",").slice(0,3).join(",").trim();
  }catch(e){ return null; }
}

/* --- public access points, from OpenStreetMap ---------------- */
function overpassQL(lat, lon, r){
  const at=`(around:${r},${lat.toFixed(5)},${lon.toFixed(5)})`;
  return `[out:json][timeout:25];
(
  nwr${at}["leisure"="slipway"];
  nwr${at}["leisure"="fishing"];
  nwr${at}["man_made"="pier"];
  nwr${at}["highway"="trailhead"];
  nwr${at}["amenity"="parking"];
);
out tags center 120;
way${at}["waterway"~"^(river|stream|canal|tidal_channel)$"];
out geom 80;`;
}

async function overpass(ql){
  const opts={method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"data="+encodeURIComponent(ql)};
  /* Generous, and deliberately longer than the 25 s the query itself is
     allowed server-side: cutting the client off first turns a slow answer
     into no answer, which is how the shop list came back empty. The
     stagger below is what keeps the common case quick — not a short
     deadline on a service that is sometimes legitimately slow. */
  const ask=(host)=>withTimeout(host, opts, 28000).then(res=>{
    if(!res.ok) throw new Error("overpass "+res.status);
    return res.json();
  });
  if(OVERPASS.length<2) return ask(OVERPASS[0]);

  /* The mirrors used to be tried strictly in turn, so a host sitting in
     a queue cost its entire timeout before the other was asked at all.
     The second is started only once the first has gone quiet for a few
     seconds, or failed — the tail gets much shorter without routinely
     doubling the load on a service run by volunteers. */
  let settled=false;
  const first=ask(OVERPASS[0]);
  first.then(()=>{settled=true;},()=>{settled=true;});
  const backup=new Promise((resolve,reject)=>{
    const go=()=>ask(OVERPASS[1]).then(resolve,reject);
    const t=setTimeout(()=>{ if(!settled) go(); }, 3500);
    first.catch(()=>{ clearTimeout(t); go(); });
  });
  return Promise.any([first,backup]).catch(e=>{
    throw (e && e.errors && e.errors[0]) || new Error("overpass unreachable");
  });
}

/* Nearest point on a mapped waterway, and what it is called. */
function nearestWater(lat, lon, ways){
  let best=null, bd=Infinity;
  for(const w of ways){
    for(const g of (w.geometry||[])){
      if(g==null) continue;
      const d=metres(lat,lon,g.lat,g.lon);
      if(d<bd){ bd=d; best=w; }
    }
  }
  return best ? {name: best.tags && best.tags.name || null, dist: bd} : null;
}

async function accessPoints(lat, lon, radiusM){
  const j=await overpass(overpassQL(lat, lon, radiusM));
  const els=(j && j.elements) || [];
  const ways=els.filter(e=>e.type==="way" && e.tags && e.tags.waterway);
  const out=[];

  for(const el of els){
    if(el.tags && el.tags.waterway) continue;             // that is the river, not a way in
    const kind=kindOf(el.tags);
    if(!kind) continue;

    const access=(el.tags.access||"").trim();
    if(PRIVATE_ACCESS.test(access)) continue;             // signed private — do not send anyone there
    if(el.tags.fee==="yes" && kind==="parking" && !el.tags.name) continue;

    const p = el.type==="node" ? {lat:el.lat, lon:el.lon}
            : el.center ? {lat:el.center.lat, lon:el.center.lon} : null;
    if(!p || !isFinite(p.lat) || !isFinite(p.lon)) continue;

    const near=nearestWater(p.lat, p.lon, ways);
    if(kind==="parking" && (!near || near.dist>PARK_MAX_M)) continue;

    out.push({
      id: el.type+"/"+el.id,
      kind,
      name: (el.tags.name||"").trim() || null,
      waterway: near && near.name || null,
      toWater: near ? near.dist : null,
      lat:p.lat, lon:p.lon,
      fee: el.tags.fee==="yes",
      surface: el.tags.surface||null,
      dist: metres(lat, lon, p.lat, p.lon),
      access,
    });
  }

  out.sort((a,b)=> (ACCESS_KINDS[a.kind].pri-ACCESS_KINDS[b.kind].pri) || (a.dist-b.dist));
  const seen=new Set(), uniq=[];
  for(const a of out){
    const key=(a.name||a.kind)+"|"+a.lat.toFixed(3)+","+a.lon.toFixed(3);
    if(seen.has(key)) continue;
    seen.add(key); uniq.push(a);
    if(uniq.length>=14) break;
  }
  return uniq;
}

/* --- fly shops, from OpenStreetMap ---------------------------
   The shop list is worth nothing at home. These are the counters
   it can actually be handed across, nearest first, with a way to
   reach each one — a shop's own website where OSM has it, and the
   place on the map where it does not.

   Every string here is world-writable, the website tag included,
   so a link is only ever built from a URL that survives safeUrl().
------------------------------------------------------------ */
const SHOP_MAX = 8;

/* A tackle shop is tagged shop=fishing; plenty of fly shops are
   filed under the general outdoor shop instead, so those come too
   — ranked below, and labelled for what they are. */
/* Fly shops are badly served by shop=fishing alone. The ones an angler
   actually drives to on the West Branch — West Branch Angler, Border
   Water, Baxter House, Cross Current — are lodges and guide services,
   and OpenStreetMap files those as tourism=hotel, as shop=outdoor, or
   as a named node with no shop tag whatsoever. Asking for three shop
   values was asking OSM a question its data cannot answer, which is why
   Hale Eddy and Starlight came back empty while the shops plainly exist.

   So: two independent signals. The tag, for places mapped as shops, and
   the NAME, for everything else. A business called "Cross Current
   Outfitters" is findable however it is tagged, and fly shops are named
   with remarkable consistency — angler, outfitter, tackle, trout, fly. */

function shopQL(lat, lon, r){
  /* Tag-only, because tags are indexed and `name` is not.
     Asking Overpass to regex every name inside a 56-mile circle is a
     full scan of ten thousand square kilometres: it exceeds the query's
     own timeout and comes back as an error, which is what the angler saw
     as "the OpenStreetMap lookup did not answer".

     So Overpass is asked the cheap question — what shops and lodgings
     are near here — and the name matching, which is the thing that
     actually finds a fly shop, happens in flyShops() over a few hundred
     objects, where it costs nothing. leisure=fishing catches the access
     points that double as a shop. */
  const at=`(around:${r},${lat.toFixed(5)},${lon.toFixed(5)})`;
  return `[out:json][timeout:25];
(
  nwr${at}["shop"];
  nwr${at}["tourism"~"^(hotel|motel|guest_house|chalet|resort)$"];
  nwr${at}["leisure"="fishing"];
);
out tags center 600;`;
}

/* Only http(s) survives. An OSM website tag is a string anyone may
   edit, and a javascript: URL in an href is script that the page's
   own CSP cannot see coming. */
function safeUrl(u){
  const raw=String(u||"").trim();
  if(!raw) return null;
  try{
    const url=new URL(/^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw : "https://"+raw);
    return (url.protocol==="http:"||url.protocol==="https:") ? url.href : null;
  }catch(e){ return null; }
}
function safeTel(t){
  const raw=String(t||"").trim();
  /* A leading parenthesis is how half of America writes a phone number,
     and requiring a digit or a plus first silently dropped every one of
     them. The characters allowed after are unchanged, and the href still
     strips everything but digits and +. */
  return /^[0-9+(][0-9+()\-. ]{5,24}$/.test(raw) ? raw : null;
}

/* The same two signals, applied to what came back. The name is checked
   before the softer tags on purpose: a hotel called the West Branch
   Angler is a fly shop with rooms, and belongs above a general outdoor
   shop that happens to be nearer. */
const FLYISH = /fly\s*-?\s*(fish|shop|rod)|angler|outfitt|tackle|trout|drift\s*-?\s*boat/i;

function shopKindOf(tags){
  if(!tags) return null;
  const name = String(tags.name||"");
  if(tags.shop==="fishing")  return {k:"fishing", label:"Fly and tackle", pri:0};
  if(FLYISH.test(name))      return {k:"fishing", label:tags.shop ? "Fly and tackle" : "Fly shop or guide", pri:0};
  if(tags.shop==="outdoor")  return {k:"outdoor", label:"Outdoor shop", pri:1};
  /* A sporting-goods or hunting shop counts only where something says it
     sells fishing — the tag, or the name, which the clause above has
     already ruled out. */
  if((tags.shop==="sports"||tags.shop==="hunting") && /fish/i.test(tags.sport||""))
    return {k:"sports", label:"Sporting goods", pri:2};
  return null;
}

/* The app's own endpoint, so the key stays on the server and the CDN can
   cache the answer for a month — shops do not move. Coordinates are
   rounded to two places before asking, so anglers near each other share
   one cached answer instead of each paying for their own.

   null means "this source is not available" — no key configured, or it
   could not answer — which is the signal to fall back to the map. An
   empty array means it answered and there is genuinely nothing. */
let placesOff=false;        // learned once: no key here, so stop asking

async function placesShops(lat, lon, radiusM){
  if(placesOff) return null;
  try{
    const u=`/api/shops?lat=${lat.toFixed(2)}&lon=${lon.toFixed(2)}&r=${Math.round(radiusM)}`;
    const res=await withTimeout(u, null, 9000);
    /* A 404 means the app is being served as plain files rather than by
       Netlify; a 200 saying configured:false means it is deployed but has
       no key. Both are permanent for this session, so ask once. */
    if(!res.ok){ placesOff=true; return null; }
    const j=await res.json();
    if(!j || j.configured===false){ placesOff=true; return null; }
    if(j.error) return null;                       // a bad minute, not a bad deploy
    if(!Array.isArray(j.shops)) return null;
    // the endpoint sorts, but the tab shows the nearest three either way
    return j.shops.slice().sort((a,b)=>(a.dist||0)-(b.dist||0));
  }catch(e){ return null; }
}

async function flyShops(lat, lon, radiusM){
  const j=await overpass(shopQL(lat, lon, radiusM));
  const out=[];
  for(const el of (j && j.elements) || []){
    const kind=shopKindOf(el.tags);
    if(!kind) continue;
    const p = el.type==="node" ? {lat:el.lat, lon:el.lon}
            : el.center ? {lat:el.center.lat, lon:el.center.lon} : null;
    if(!p || !isFinite(p.lat) || !isFinite(p.lon)) continue;
    const t=el.tags;
    /* An outdoor shop with no name is a map note, not somewhere to
       send a person at seven in the morning. */
    const name=(t.name||"").trim();
    if(!name) continue;
    const addr=[t["addr:housenumber"], t["addr:street"]].filter(Boolean).join(" ");
    out.push({
      id: el.type+"/"+el.id,
      name, kind:kind.k, kindLabel:kind.label, pri:kind.pri,
      where: [addr, t["addr:city"]].filter(Boolean).join(", ") || null,
      site: safeUrl(t.website || t["contact:website"] || t.url),
      tel:  safeTel(t.phone || t["contact:phone"]),
      map:  `https://www.openstreetmap.org/${el.type}/${el.id}`,
      lat:p.lat, lon:p.lon,
      dist: metres(lat, lon, p.lat, p.lon),
    });
  }
  out.sort((a,b)=> (a.pri-b.pri) || (a.dist-b.dist));
  const seen=new Set(), uniq=[];
  for(const sh of out){
    const key=sh.name.toLowerCase()+"|"+sh.lat.toFixed(2)+","+sh.lon.toFixed(2);
    if(seen.has(key)) continue;
    seen.add(key); uniq.push(sh);
    if(uniq.length>=SHOP_MAX) break;
  }
  return uniq;
}

/* --- USGS gauges --------------------------------------------- */
function parseRDB(text){
  const rows=[]; let head=null;
  for(const line of text.split("\n")){
    if(!line || line[0]==="#") continue;
    const cells=line.split("\t");
    if(!head){ head=cells; continue; }
    if(/^\d+[a-z]$/i.test(cells[0]||"")) continue;                 // the RDB format line
    const o={}; head.forEach((h,i)=>o[h]=cells[i]);
    rows.push(o);
  }
  return rows;
}

async function nearestGauge(lat, lon){
  for(const pad of [0.25, 0.6]){
    const bbox=[(lon-pad).toFixed(4),(lat-pad).toFixed(4),(lon+pad).toFixed(4),(lat+pad).toFixed(4)].join(",");
    const url=`https://waterservices.usgs.gov/nwis/site/?format=rdb&bBox=${bbox}`
            + `&siteType=ST&siteStatus=active&hasDataTypeCd=iv&parameterCd=00060&siteOutput=expanded`;
    try{
      const res=await withTimeout(url, null, 12000);
      if(!res.ok) continue;
      const rows=parseRDB(await res.text());
      let best=null, bd=Infinity;
      for(const r of rows){
        const la=parseFloat(r.dec_lat_va), lo=parseFloat(r.dec_long_va);
        if(!isFinite(la)||!isFinite(lo)) continue;
        const d=metres(lat,lon,la,lo);
        if(d<bd){ bd=d; best={id:r.site_no, name:(r.station_nm||"").trim(), lat:la, lon:lo,
                              area:parseFloat(r.drain_area_va), dist:bd}; }
      }
      if(best) return best;
    }catch(e){ /* try the wider box, then give up */ }
  }
  return null;
}

/* --- what rivers are near here -------------------------------
   This is the same bBox call nearestGauge already makes; it used to
   keep the closest row and throw the rest of the response away. The
   rest of the response is a list of the gauged rivers around a point,
   from USGS, with a name, a position and a drainage area on each —
   which is exactly the list an angler wants after typing a town, and
   exactly the list nobody should be writing by hand.

   A gauge is also the thing that makes a river readable: it is where
   the live flow and water temperature that drive the plays come from.
   So a river that appears here is one Riffle can actually read, and
   picking it hands the plays that gauge rather than whichever one
   happened to be nearest the pin.
------------------------------------------------------------ */

/* USGS station names carry the gauge's business, not the river's:
   "BEAVER KILL AT COOKS FALLS NY". The river is the part before the
   locator, and that is what belongs on a button. */
const AT_SPLIT = /\s+(?:AT|NEAR|NR|ABOVE|ABV|BELOW|BLW|BL)\s+/i;
function riverNameOf(station){
  const raw = String(station||"").split(AT_SPLIT)[0].replace(/,.*$/,"").trim();
  if(!raw) return "Unnamed gauge";
  /* USGS shouts. Title-case it, but leave initialisms and directions alone. */
  return raw.toLowerCase().replace(/\b[a-z]/g, c=>c.toUpperCase())
            .replace(/\b(Ef|Wf|Nf|Sf|Mf)\b/g, m=>m.toUpperCase());
}

/* Rivers big enough to be worth a drive. A gauge on a 3 sq mi headwater
   ditch is a real gauge and not a fishery, and the list is more useful
   short. */
const RIVER_MIN_AREA = 8;      // square miles of drainage
const RIVER_MAX      = 12;

async function nearbyRivers(lat, lon){
  const out=new Map();
  for(const pad of [0.35, 0.8]){
    const bbox=[(lon-pad).toFixed(4),(lat-pad).toFixed(4),(lon+pad).toFixed(4),(lat+pad).toFixed(4)].join(",");
    const url=`https://waterservices.usgs.gov/nwis/site/?format=rdb&bBox=${bbox}`
            + `&siteType=ST&siteStatus=active&hasDataTypeCd=iv&parameterCd=00060&siteOutput=expanded`;
    try{
      const res=await withTimeout(url, null, 12000);
      if(!res.ok) continue;
      for(const r of parseRDB(await res.text())){
        const la=parseFloat(r.dec_lat_va), lo=parseFloat(r.dec_long_va);
        if(!isFinite(la)||!isFinite(lo)) continue;
        const area=parseFloat(r.drain_area_va);
        if(isFinite(area) && area>0 && area<RIVER_MIN_AREA) continue;
        const name=riverNameOf(r.station_nm);
        const dist=metres(lat,lon,la,lo);
        /* One row per river, not per gauge: a river with four gauges on it
           is one button, and the button is the gauge nearest the angler. */
        const prev=out.get(name);
        if(!prev || dist<prev.dist)
          out.set(name, {id:r.site_no, river:name, station:(r.station_nm||"").trim(),
                         lat:la, lon:lo, area:isFinite(area)?area:null, dist});
      }
      if(out.size>=4) break;         // the tight box answered; no need to widen
    }catch(e){ /* try the wider box, then give up */ }
  }
  return [...out.values()].sort((a,b)=>a.dist-b.dist).slice(0, RIVER_MAX);
}

/* Drainage area for a pair of sites, so flow bands can be scaled. */
async function drainAreas(sites){
  try{
    const url=`https://waterservices.usgs.gov/nwis/site/?format=rdb&sites=${sites.join(",")}&siteOutput=expanded`;
    const res=await withTimeout(url, null, 12000);
    if(!res.ok) return {};
    const out={};
    for(const r of parseRDB(await res.text())){
      const a=parseFloat(r.drain_area_va);
      if(isFinite(a)&&a>0) out[r.site_no]=a;
    }
    return out;
  }catch(e){ return {}; }
}

/* --- the spot profile ---------------------------------------- */
/* --- how far the book reaches -------------------------------
   This used to be a distance. A spot borrowed the nearest of the
   27 waters and anything past 250 miles was switched off, which
   put Baldwin, Michigan — the Pere Marquette — on a Lake Erie
   steelhead creek 298 miles away, and then gated it out for being
   too far. Both halves were wrong, and for the same reason: miles
   are not what makes one river a reading for another.

   Two things travel, and they travel differently.

   The CALENDAR travels on latitude. The shift field on each water
   is the number of days that river runs behind or ahead of the
   Beaverkill, and all 20 trout entries were written by hand, river
   by river, with no formula in mind. Fitted afterwards they come to
   4.86 days per degree of latitude, +5.1 for a tailwater and −2.1
   for a limestoner — R² 0.96, mean error one day. Hopkins' bio-
   climatic law puts the latitude term at 4 days per degree, which
   is a number nobody in this file was aiming at. So the shift is
   computed now, and the hand-written values stay as the check.

   The SPECIES do not travel at all. Hendricksons, sulphurs, Cahills
   and the rest are the eastern North American assemblage; west of
   the plains it is Salmonfly and PMD and a different insect fauna
   that this book has never heard of. That is a range, not a radius
   — so the gate is where these bugs live, and inside it a computed
   shift carries the calendar the whole way.
------------------------------------------------------------ */

/* Days a hatch runs behind the Beaverkill at 41.95° N. Fitted to the
   27, then held to them by test. */
const PHENOLOGY_REF_LAT = 41.95;
const PHENOLOGY = {perDegLat: 4.86, tailwater: 5.14, limestone: -2.12, base: -0.36};

function bioShift(lat, type){
  const p = PHENOLOGY;
  const d = p.perDegLat*(lat - PHENOLOGY_REF_LAT) + p.base
          + (type==="tailwater" ? p.tailwater : 0)
          + (type==="limestone" ? p.limestone : 0);
  return Math.round(clamp(d, -30, 40));
}

/* The range of the bugs in this book: eastern North America, from the
   Southern Appalachians to the boreal edge, and from the Atlantic to
   the western limit of the eastern mayfly fauna out past the Driftless
   and the Ozarks. Inside it the calendar is the same calendar, moved
   by latitude. Outside it the app says so rather than guessing, because
   a Montana river is not a late Catskill river — it is a different
   fauna, and no shift in days will turn one into the other. */
const EAST = {latMin:33.5, latMax:50.0, lonMin:-97.0, lonMax:-52.0};
const inEast = (lat, lon)=> lat>=EAST.latMin && lat<=EAST.latMax
                         && lon>=EAST.lonMin && lon<=EAST.lonMax;

/* How far the borrowed *thermal* curve is being stretched. The calendar
   is handled by the shift; this is about the temperature and flow curves,
   which are a real river's numbers and get less like yours the further
   the analogue sits in latitude. */
function rangeOf(latGap){
  if(latGap<=1.2) return "near";       // about 80 miles of latitude
  if(latGap<=4.0) return "borrowed";
  return "far";
}

/* Which water in the book is the best READING for this point — not the
   closest one. Latitude dominates, because it sets both the thermal
   season and the calendar; water type matters nearly as much, since a
   bottom-release tailwater and a limestone spring creek at the same
   latitude are different rivers all year; longitude barely matters at
   all, and only as a proxy for how continental the climate is.

   Nearest-by-miles put Oatka Creek, a trout stream, on Oak Orchard's
   steelhead calendar, and Baldwin on Conneaut Creek. Both go away when
   the question is "what is this river like" instead of "what is near". */
function climateDist(lat, lon, type, w){
  return Math.abs(lat - w.lat)
       + (type && type!==w.type ? 0.8 : 0)
       + Math.abs(lon - w.lon)*0.12;
}
function templateFor(lat, lon, sp, type){
  const pool = sp ? WATERS.filter(w=>w.sp===sp) : WATERS;
  const from = pool.length ? pool : WATERS;
  let best=from[0], bd=Infinity;
  for(const w of from){
    const d=climateDist(lat, lon, type, w);
    if(d<bd){ bd=d; best=w; }
  }
  return {w:best, dist:metres(lat,lon,best.lat,best.lon), latGap:Math.abs(lat-best.lat)};
}

/* Flow scales roughly with the area that drains into the gauge,
   so a template river's bands can be carried to a different
   gauge when both areas are known. When they are not, the bands
   travel unscaled and the panel says so rather than pretending. */
function scaleBands(tmpl, ratio){
  const s=v=>Math.max(1, Math.round(v*ratio));
  return {
    flow:{low:s(tmpl.flow.low), ideal:[s(tmpl.flow.ideal[0]), s(tmpl.flow.ideal[1])],
          high:s(tmpl.flow.high), blown:s(tmpl.flow.blown)},
    wade:{full:s(tmpl.wade.full), good:s(tmpl.wade.good),
          limited:s(tmpl.wade.limited), max:s(tmpl.wade.max)},
  };
}

function gaugeAway(m){
  const mi=m/1609.34;
  if(mi<0.6) return "right at the pin";
  return `${mi<10?mi.toFixed(1):Math.round(mi)} miles from the pin`;
}

function spotProfile(point, tmpl, tmplDistM, gauge, ratio, latGap){
  const calibrated = isFinite(ratio) && ratio>0;
  const bands = calibrated ? scaleBands(tmpl, ratio) : {flow:tmpl.flow, wade:tmpl.wade};
  const miles = Math.round(tmplDistM/1609.34);
  const away  = miles<1 ? "on it" : `${miles} mile${miles===1?"":"s"} away`;
  const ownGauge = !!gauge && gauge.id===tmpl.gauge;

  /* The calendar is gated on where these bugs live, not on how far the
     analogue is. Inside their range the shift carries it; outside, the
     seasonal half goes quiet and the measured half stays. */
  const east   = inEast(point.lat, point.lon);
  const beyond = !east;
  const type   = point.type || (beyond ? "unknown" : tmpl.type);
  const range  = beyond ? "far" : rangeOf(latGap==null ? 0 : latGap);
  const shift  = beyond ? 0 : bioShift(point.lat, type);
  const dLat   = Math.round((point.lat - tmpl.lat)*10)/10;

  return {
    id: "spot:"+point.lat.toFixed(4)+","+point.lon.toFixed(4),
    hatchKey: tmpl.id,                       // borrow this water's hatch calendar
    name: point.name || "Selected spot",
    place: point.place || "",
    lat: point.lat, lon: point.lon,
    range, beyond, templateMiles: miles, latGap: latGap==null?null:Math.round(latGap*10)/10,
    /* Outside the eastern fauna the book has no species to claim, so it
       claims none — that is how a Montana trout river came to be read as
       a Lake Erie steelhead run. */
    type,
    sp:   beyond ? "unknown" : (point.sp || tmpl.sp),
    size: point.size || tmpl.size,
    gauge: gauge ? gauge.id : tmpl.gauge,
    unit: "cfs",
    flow: bands.flow, wade: bands.wade, float: tmpl.float,
    temps: tmpl.temps, swing: tmpl.swing, flowIx: tmpl.flowIx, stepped: tmpl.stepped,
    shift, char: tmpl.char,
    note: (beyond
        ? `This point is outside the range of the insects in Riffle's book, which are the `
          + `eastern North American hatches. A different fauna lives here and no shift in `
          + `days turns one into the other, so the hatch chart and the plays that read it `
          + `are switched off rather than borrowed. `
          + (gauge ? `The gauge is real: USGS ${gauge.id} — `
                   + `${(gauge.name||"unnamed gauge").toLowerCase()}, ${gaugeAway(gauge.dist)}.`
                   : `No live gauge was found nearby either, so there are no numbers to show.`)
        : `Seasonal temperature and flow character are modeled on ${tmpl.name} — the closest `
          + `match in the book by latitude and river type, ${Math.abs(dLat)<0.15 ? "at the same latitude"
              : `${Math.abs(dLat).toFixed(1)}° of latitude ${dLat>0?"south":"north"} of here`}. `
          + `Hatch dates are moved ${shift===0?"not at all":`${Math.abs(shift)} day${Math.abs(shift)===1?"":"s"} ${shift>0?"later":"earlier"}`} `
          + `for this latitude and river type. `
          + (range==="far" ? `That is a long stretch for a borrowed thermal curve — carry a thermometer. ` : "")
          + (gauge ? `Flow and water temperature read from USGS ${gauge.id} — `
                   + `${(gauge.name||"unnamed gauge").toLowerCase()}, ${gaugeAway(gauge.dist)}. `
                   : `No live gauge was found nearby, so the numbers are modeled. `)
          + (!calibrated ? `Flow bands are ${tmpl.name}'s, uncalibrated for this gauge — read them as rough.`
             : ownGauge  ? `The flow bands are this gauge's own.`
                         : `Flow bands are scaled from ${tmpl.name}'s by drainage area (×${ratio.toFixed(2)}).`)),
    pickedGauge: point.pickedGauge || null,
    spot: {template:tmpl, templateMiles:miles, away, gauge, ratio: calibrated?ratio:null, calibrated},
  };
}

/* Assemble everything for a chosen point. Network failures are
   degradations, never dead ends: worst case the angler still
   gets the nearest water in the book, modeled. */
async function buildSpot(point){
  const {w:tmpl, dist, latGap} = templateFor(point.lat, point.lon, point.sp, point.type);
  let ratio=NaN;
  /* A river picked off the list already knows its gauge — it IS a gauge.
     Only a bare pin has to go looking for one. */
  let gauge = point.gauge || null;
  if(!gauge){ try{ gauge = await nearestGauge(point.lat, point.lon); }catch(e){ gauge=null; } }
  if(gauge && gauge.id!==tmpl.gauge){
    const areas = await drainAreas([gauge.id, tmpl.gauge]);
    const a=areas[gauge.id], b=areas[tmpl.gauge];
    if(isFinite(gauge.area) && gauge.area>0 && isFinite(b) && b>0) ratio=gauge.area/b;
    else if(isFinite(a) && a>0 && isFinite(b) && b>0) ratio=a/b;
    if(isFinite(ratio)) ratio=clamp(ratio, 0.02, 50);
  } else if(gauge && gauge.id===tmpl.gauge){
    ratio=1;
  }
  return spotProfile(point, tmpl, dist, gauge, ratio, latGap);
}

/* ============================================================
   5. RENDER
   ============================================================ */
const $=(s,r)=>(r||document).querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function tempClass(t, isGL){
  if(isGL) return t>65?"bad":t<36?"warn":"good";
  if(t>=68) return "bad"; if(t>=65) return "warn";
  if(t>=54&&t<=64) return "good"; if(t<42) return "warn"; return "";
}
function tempNote(t, isGL){
  if(isGL){
    if(t>65) return "Too warm — stop"; if(t<34) return "Ice water, tiny window";
    if(t<38) return "Lethargic, bite zone inches wide"; if(t<45) return "Moderately active";
    if(t<=58) return "Will chase — swing them"; return "Marginal";
  }
  if(t>=70) return "Lethal — do not fish"; if(t>=68) return "Stop — delayed mortality";
  if(t>=65) return "Stressed, dawn only"; if(t>=62) return "Active, release fast";
  if(t>=54) return "Prime — fish hard"; if(t>=50) return "Waking up";
  if(t>=44) return "Subsurface, won't chase"; if(t>=40) return "Slow, deep, midday";
  return "Lethargic — midday only";
}

function accFlipTxt(ctx){
  const a=ctx.acc, u=ctx.w.unit.split(" ")[0];
  const modelled = ctx.flowSource!=="live";
  const src = modelled ? "Flow is modeled, so check the gauge before you hitch the trailer. " : "Live gauge reading. ";
  if(a.flip.dir==="over") return `${src}Blowout number for ${esc(ctx.w.name)} is <b>${a.wd.max} ${u}</b>; today sits ${a.flip.gap} over it.`;
  return `${src}Wading thresholds here: <b>${a.wd.full}</b> full river · <b>${a.wd.good}</b> most of it · <b>${a.wd.limited}</b> ${a.canFloat?"boat wins":"edges only"} · <b>${a.wd.max}</b> ${u} is the ceiling. Today is <b>${a.flip.gap} ${u}</b> below the next step up.`;
}

/* --- what sits where ----------------------------------------
   Everything you read while you are standing in the river is on
   Fish, in the order you ask it: the river's numbers, then the
   wade-or-float call, then the plays, then what is hatching. The
   strip above the tabs names the water; the strip below them
   carries the day, because every panel is read through it.
------------------------------------------------------------ */

/* Quick ways to say "the day I am actually going". */
function planShortcuts(){
  const now=new Date(), out=[{label:"Now", iso:null}];
  const at=(n)=>{ const d=new Date(now); d.setDate(d.getDate()+n); return d; };
  const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  out.push({label:"Tomorrow", iso:isoLocal(at(1))});
  for(let n=2;n<=8 && out.length<5;n++){
    const d=at(n);
    if(d.getDay()===6 || d.getDay()===0) out.push({label:DAY[d.getDay()], iso:isoLocal(d)});
  }
  if(out.length<5) out.push({label:"In a week", iso:isoLocal(at(7))});
  return out;
}

function leadLine(ctx){
  const mem = ctx.mem.days
    ? ` Your book has <b>${ctx.mem.days} day${ctx.mem.days===1?"":"s"}</b> on this water within three weeks of that date, and they are already in the ranking.`
    : "";
  if(!ctx.lead){
    return `Reading <b>right now</b>, from the gauge where there is one.${mem}`;
  }
  const pct=Math.round(ctx.carry.flow*100);
  const gauge = ctx.live
    ? (ctx.carry.flow>=CARRY_MIN
        ? `Today's gauge still accounts for about <b>${pct}%</b> of the flow number that far out; the rest is this water's seasonal curve.`
        : `That is too far out for today's gauge to mean anything, so the flow and temperature are this water's seasonal curve alone.`)
    : `There is no live gauge here anyway — these numbers are modeled from the date and this water's seasonal character.`;
  return `<b>${ctx.lead} day${ctx.lead===1?"":"s"} out.</b> ${gauge}${mem} Come back the morning of and it will have hardened up.`;
}

function renderPlanBar(ctx){
  const w=ctx.w;
  const live = ctx.flowSource==="live" || ctx.tempSource==="live";
  const carried = ctx.flowSource==="carried" || ctx.tempSource==="carried";
  const pill = live?["live","Live gauge"] : carried?["carried","Gauge, carried forward"] : ["","Modeled"];
  const dateStr=ctx.d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  const timeStr=ctx.d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  const maxDate=(()=>{ const d=new Date(); d.setDate(d.getDate()+LEAD_MAX); return isoLocal(d); })();
  const cur=state.plan ? state.plan.date : null;
  const hh=state.plan ? state.plan.hour : ctx.d.getHours()+ctx.d.getMinutes()/60;

  $("#planbar").innerHTML=`
    <div class="pb-id">
      <h2>${esc(w.name)}</h2>
      <div class="rd-sub">
        <span>${esc(w.place)}</span><span class="dot"></span>
        <span>${dateStr}, ${timeStr}</span><span class="dot"></span>
        <span>${ctx.lw.label}</span>
        <span class="srcpill ${pill[0]}">${pill[1]}</span>
        ${ctx.lead?`<span class="srcpill plan">Planned · ${ctx.lead} day${ctx.lead===1?"":"s"} out</span>`:""}
      </div>
    </div>`;

  /* The picker lives on Plan now, and that panel is built on first use —
     so there is nothing to write into until whereShell() has run. */
  const when=$("#whenbar");
  if(!when) return;
  when.innerHTML=`
    <div class="pb-when">
      <div class="dlab">Which day are you fishing?</div>
      <div class="rchips" id="planChips">
        ${planShortcuts().map(o=>`
          <button type="button" class="rchip${o.iso?"":" auto"}" data-iso="${o.iso||""}"
            aria-pressed="${o.iso ? cur===o.iso : !state.plan}">${esc(o.label)}</button>`).join("")}
      </div>
      <div class="pb-fields">
        <input class="dinput date" type="date" id="planDate" value="${esc(cur||isoLocal(new Date()))}"
               min="${esc(isoLocal(new Date()))}" max="${esc(maxDate)}" aria-label="Day you plan to fish">
        <input class="dinput date" type="time" id="planTime"
               value="${String(Math.floor(hh)).padStart(2,"0")}:${String(Math.round((hh%1)*60)).padStart(2,"0")}"
               aria-label="Time of day">
        ${state.plan?`<button type="button" class="dbtn ghost" id="planNow">Back to now</button>`:""}
      </div>
      <p class="pb-lead">${leadLine(ctx)}</p>
    </div>`;
  wirePlan();
}

function wirePlan(){
  document.querySelectorAll("#planChips .rchip").forEach(b=>b.addEventListener("click",()=>{
    const iso=b.dataset.iso;
    if(!iso){ state.plan=null; }
    else {
      const now=new Date();
      state.plan={date:iso, hour: state.plan ? state.plan.hour : now.getHours()+now.getMinutes()/60};
    }
    draw();
  }));
  const dateEl=$("#planDate"), timeEl=$("#planTime"), nowBtn=$("#planNow");
  const commit=()=>{
    const iso=dateEl.value, t=(timeEl.value||"09:00").split(":").map(Number);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
    const hour=clamp((t[0]||0)+(t[1]||0)/60, 0, 23.99);
    state.plan = (iso===isoLocal(new Date()) && !state.plan) ? null : {date:iso, hour};
    draw();
  };
  if(dateEl) dateEl.addEventListener("change", commit);
  if(timeEl) timeEl.addEventListener("change", commit);
  if(nowBtn) nowBtn.addEventListener("click",()=>{ state.plan=null; draw(); });
}

/* --- section one: the river's numbers, at the top of Fish -----
   The dashboard carries the gauge it is reading and what this
   river is actually like, so there is nothing left to look up on
   another tab to know where a number came from.
------------------------------------------------------------ */
function gaugeMetaHTML(ctx){
  const w=ctx.w, sp=w.spot;
  const src = ctx.flowSource==="live"
    ? "Reading live."
    : "No live reading here \u2014 flow and temperature are modeled from the date and this water's seasonal character.";
  const borrowed = sp
    ? `<p>Seasonal curves come from <b>${esc(sp.template.name)}</b> \u2014 ${sp.templateMiles<1?"you are on it":esc(sp.away)}.</p>`
    : "";
  const uncal = sp && !sp.calibrated
    ? `<div class="hint" role="note">
        <span>\u2691</span>
        <span><b>Flow bands are uncalibrated.</b> Drainage area was unavailable for one of the gauges, so the
          numbers above are ${esc(sp.template.name)}'s. Read the band, not the threshold.</span>
       </div>`
    : "";
  return `<div class="rd-meta">
    <p><b>Gauge ${esc(w.gauge)}</b> \u00b7 ideal ${w.flow.ideal[0]}\u2013${w.flow.ideal[1]} ${esc(w.unit)} \u00b7 blown above ${w.flow.blown}. ${src}</p>
    ${borrowed}
    <p class="rd-note">${esc(w.note)}</p>
    ${uncal}
  </div>`;
}

function conditionsHTML(ctx, id){
  const w=ctx.w;
  const tmin=ctx.isGL?30:32, tmax=ctx.isGL?70:76;
  const pos=clamp((ctx.temp-tmin)/(tmax-tmin),0,1)*100;
  const sun=ctx.sun;
  /* Say where each number came from — but only when it is not simply
     the gauge, which the pill above has already said. */
  const word={live:"read live", carried:"carried forward from today's gauge", you:"your own read", model:"modeled"};
  /* A modeled number is the seasonal curve of the template water. Inside
     the book that is a neighbouring river; outside it, it is a river a
     thousand miles away, so the cell shows nothing rather than a figure
     that looks measured. A live gauge is a live gauge anywhere. */
  const noTemp = ctx.outOfBook && ctx.tempSource==="model";
  const noFlow = ctx.outOfBook && ctx.flowSource==="model";
  const prov = ctx.outOfBook
    ? (noTemp && noFlow ? "No gauge was found near this point, and this water is outside the book, so there is nothing here to model from."
       : noTemp ? "Flow is a live gauge reading. Water temperature has no gauge here and cannot be modeled outside the book."
       : noFlow ? "Water temperature is a live gauge reading. Flow has no gauge here and cannot be modeled outside the book."
       : "Both numbers are live gauge readings — those hold anywhere.")
    : ctx.tempSource==="live" && ctx.flowSource==="live" ? ""
    : `Water temperature ${word[ctx.tempSource]}, flow ${word[ctx.flowSource]}.`;
  return `<section class="reading" id="${id||"conditions"}">
    <div class="rd-head">
      <div class="rd-water">
        <h2>River conditions</h2>
        <div class="rd-sub">
          <span>${esc(w.name)}</span><span class="dot"></span>
          <span>${ctx.lead?`${ctx.lead} day${ctx.lead===1?"":"s"} out`:"right now"}</span><span class="dot"></span>
          <span>gauge ${esc(w.gauge)}</span>
        </div>
      </div>
    </div>
    <div class="gauges">
      <div class="g ${noTemp?"":tempClass(ctx.temp,ctx.isGL)}">
        <div class="lab">Water</div>
        <div class="val">${noTemp?"\u2014":ctx.temp.toFixed(0)+"\u00b0"}</div>

/* --- section two: the call, at the top of the plays ---------- */
function tacticHTML(ctx){
  return `<section class="reading tactic" id="tactic">
    <div class="access">
      <div class="acc-top">
        <span class="acc-call ${ctx.acc.tone}">${esc(ctx.acc.call)}</span>

        <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
        <span class="mk" style="left:calc(${(ctx.acc.pos*100).toFixed(1)}% - 1.5px)"></span>
      </div>

      </div>

      </dl>
      <div class="acc-flip">${accFlipTxt(ctx)}</div>
    </div>
  </section>`;
}

function baroTrace(hist){
  if(!hist || hist.length<3) return "";
  const lo=Math.min(...hist), hi=Math.max(...hist), span=Math.max(hi-lo, 1.5);
  const pts=hist.map((v,i)=>{
    const x=(i/(hist.length-1))*58+1;
    const y=20-((v-lo)/span)*18;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg class="baro-trace" viewBox="0 0 60 22" aria-hidden="true"
            role="img" aria-label="Pressure over the last six hours"><polyline points="${pts}"/></svg>`;
}

function baroBand(ctx){
  const b=ctx.baro;
  const val = b.hPa!=null ? (b.hPa*HPA_IN).toFixed(2) : "\u2014";
  const delta = b.delta!=null ? `${b.delta>0?"+":""}${(b.delta*HPA_IN).toFixed(2)}\u2033 / 3h` : "";
  return `<div class="baro">
    <div class="baro-top">
      <span class="baro-lab">Barometer</span>
      <span class="srcpill ${b.source==="live"?"live":""}">${esc(b.srcLabel)}</span>
      ${delta?`<span class="baro-delta">${esc(delta)}</span>`:""}
    </div>
    <div class="baro-body">
      <span class="baro-read">
        <span class="baro-val">${val}</span>
        <span class="baro-unit">inHg</span>
        <span class="baro-arrow ${b.tone}">${b.arrow}</span>
      </span>
      <span class="baro-state ${b.tone}">${esc(b.label)}</span>
      ${baroTrace(b.hist)}
    </div>
    <div class="baro-line">${esc(b.line)}</div>
  </div>`;
}

function flyItem(f){
  return `<div class="flyrow">
    <span class="swatch" style="background:${esc(f.hex)}"></span>
    <div class="flymain">
      <div class="flyname">${esc(f.name)}</div>
      <div class="flyspec">${esc(f.size)}</div>
      ${f.note?`<div class="flynote">${esc(f.note)}</div>`:""}
    </div>
    <span class="qty">${esc(f.qty)}</span>
  </div>`;
}

/* Colder water to go to instead. This is a driving distance, not a
   statement about the calendar, so it has its own number: far enough to
   be worth the morning, close enough that "nearby" is not a lie. Without
   it the list was unbounded, and a spot at the edge of the borrowed band
   was offered rivers most of a day away. */
const REFUGE_MAX_MI = 150;

function refuges(ctx){
  return WATERS
    .filter(w=>w.sp==="trout" && w.id!==ctx.w.id && (w.type==="tailwater"||w.type==="limestone"))
    .map(w=>({w, t:modelTemp(w,ctx.d), d:haversine(ctx.w.lat,ctx.w.lon,w.lat,w.lon)}))
    .filter(o=>o.t<=63 && o.d<=REFUGE_MAX_MI)
    .sort((a,b)=>a.d-b.d).slice(0,3);
}
/* What Riffle can and cannot say about a water outside its book.
   The measured things still stand: a USGS gauge is a USGS gauge, a
   thermometer is a thermometer, and OpenStreetMap maps the whole
   country. Only the modeled things go. */
function outOfBookCard(ctx){
  const liveTemp = ctx.tempSource==="live" || ctx.tempSource==="carried";
  const t=ctx.temp;
  const thermal = !liveTemp
    ? `No gauge here is reporting water temperature, and outside the book there is no curve to model one from — carry a thermometer.`
    : t>=68
      ? `At <b>${t.toFixed(0)} °F</b> the water is too warm for trout wherever you are standing; that number needs no calendar.`
      : `The gauge reads <b>${t.toFixed(0)} °F</b>. Trout stress above 65 and should not be fished above 68, on any river.`;
  return `<div class="gate">
    <h2>Outside the book</h2>
    <p>Riffle's hatch calendar is the <b>eastern North American</b> one — Hendricksons,
       sulphurs, Cahills, Isonychia. Those insects do not live here. What hatches on this
       water is a different fauna the book has never carried, and no amount of shifting
       dates turns one into the other — so the hatch chart and the plays that read it are
       off rather than borrowed. A guess would look exactly like a reading.</p>
    <p><b>What still holds:</b> a USGS gauge is a USGS gauge, and the access points and
       fly shops come from OpenStreetMap, which maps the whole country. ${thermal}</p>
    <p>Anywhere from the Appalachians to the Driftless and the Ozarks gets the full
       reading — the calendar travels on latitude. Out here, use this for the gauge,
       the access and the shops.</p>
  </div>`;
}

function gateCard(ctx){
  if(ctx.outOfBook) return outOfBookCard(ctx);
  if(ctx.isGL){
    if(ctx.temp<=65) return "";
    return `<div class="gate"><h2>Too warm for steelhead</h2>
      <p>The water is modeled at <b>${ctx.temp.toFixed(0)} °F</b>. Above about 65 °F these fish cannot hold, and a hooked fish is unlikely to recover. Come back on the next cold rain.</p></div>`;
  }
  if(ctx.temp<65) return "";
  const stop = ctx.temp>=68;
  const refs=refuges(ctx);
  return `<div class="gate">
    <h2>${stop?"Stop — the water is too warm":"Marginal water temperature"}</h2>
    <p>${esc(ctx.w.name)} is modeled at <b>${ctx.temp.toFixed(0)} °F</b> right now.
    ${stop?"Above 68 °F released trout die hours later even when they swim away strong. Delayed mortality runs roughly 69 percent higher at 73 °F than below 66 °F. The right call is to fish somewhere colder."
          :"Fish only at first light, keep them wet, and release fast. If it climbs past 68, stop."}</p>
    ${refs.length?`<p style="font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px">Colder water nearby, modeled now</p>
      ${refs.map(o=>`<div class="refuge">
        <span class="rn">${esc(o.w.name)}<span>${esc(o.w.place)} · ${o.d} mi · ${esc(o.w.type)}</span></span>
        <span class="rt">${o.t.toFixed(0)}°</span></div>`).join("")}`:""}
    <p style="margin-top:11px">The plays below are still here for a dawn window or a cold tributary mouth — read them with that in mind.</p>
  </div>`;
}

/* The thresholds behind the call above it: the same ladder, with the
   numbers named. It reads on Fish, where you are deciding whether to
   get in the water, rather than on Plan where you are still driving. */
function ladderHTML(ctx){
  const rows=[
    ["Up to "+ctx.w.wade.full,   "Full river wadable"],
    ["Up to "+ctx.w.wade.good,   "Most of it wadable \u2014 choose crossings"],
    ["Up to "+ctx.w.wade.limited, ctx.acc.canFloat?"Boat is the better tool":"Bank and inside-bend water only"],
    ["Up to "+ctx.w.wade.max,     ctx.acc.canFloat?"Boat only":"Top of safe wading"],
    ["Above "+ctx.w.wade.max,    "Blown \u2014 do not wade"],
  ];
  return `<div class="wcard" id="ladderCard">
    <h3>Access ladder \u2014 ${esc(ctx.w.name)}</h3>
    <p>${esc(FLOAT_TXT[ctx.w.float])} Today's reading is <b>${ctx.cfs} ${esc(ctx.w.unit.split(" ")[0])}</b>${ctx.flowSource==="live"?" (live)":" (modeled)"}.</p>
    <div class="wlist">
      ${rows.map(([a,b])=>`<div class="refuge"><span class="rn">${esc(b)}</span><span class="wd">${esc(a)}</span></div>`).join("")}
    </div>
  </div>`;
}

function wireRefine(){
