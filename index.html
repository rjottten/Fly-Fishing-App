/* --- diary --------------------------------------------------
   The form is the only place in Riffle the angler types rather
   than taps, so it has to survive the ten-minute redraw: every
   render harvests what is on screen first, and a render is
   skipped outright while a field has the caret in it.
------------------------------------------------------------ */
function freshForm(ctx){
  return {date:isoLocal(new Date()), outcome:null, methods:[], hatches:[], flies:"", notes:"",
          cond:{flow:ctx.fs.k, clarity:ctx.clarity.k, sky:ctx.sky}};
}
function harvestDiaryForm(){
  const f=state.dform; if(!f) return;
  const d=$("#dDate"), fl=$("#dFlies"), n=$("#dNotes");
  if(d && /^\d{4}-\d{2}-\d{2}$/.test(d.value)) f.date=d.value;
  if(fl) f.flies=fl.value;
  if(n)  f.notes=n.value;
}

/* Bugs worth offering for the logged date — what the calendar has
   on, plus the ones just off either end, because a hatch running
   two weeks late is exactly the thing worth writing down. */
function hatchChoices(w, iso){
  const day=dayOfISO(iso);
  const sh=(hx)=> hx.waters==="all" ? w.shift : 0;
  return HATCHES
    .filter(hx => hx.waters==="all" ? w.sp==="trout" : hx.waters.includes(hatchKeyOf(w)))
    .map(hx=>{
      const s=hx.win[0]+sh(hx), e=hx.win[2]+sh(hx);
      const inw = day>=s && day<=e;
      return {hx, inw, near: inw?0:Math.min(doyGap(day,s), doyGap(day,e))};
    })
    .filter(o=>o.inw || o.near<=MEM_STRETCH+10)
    .sort((a,b)=>a.near-b.near)
    .slice(0,14);
}

function memLine(m){
  const days=`${m.days} day${m.days===1?"":"s"}`;
  if(m.pct===0) return `Your book has ${days} on this water near this date on <b>${esc(m.label.toLowerCase())}</b>, and they pull against each other — no nudge either way.`;
  return `${days} on <b>${esc(m.label.toLowerCase())}</b> in your book, on this water near this date, went <b>${esc(m.verdict)}</b> — so this play is ranked <b>${m.pct>0?"+":""}${m.pct}%</b>.`;
}

function renderDiary(ctx){
  const el=$("#diary");
  const typing=document.activeElement;
  // a background redraw must never yank the field the caret is in
  if(typing && el.contains(typing) && /^(INPUT|TEXTAREA)$/.test(typing.tagName) && !state.dredraw) return;
  harvestDiaryForm();
  const refocus = typing && el.contains(typing) && typing.classList.contains("dchip")
    ? {f:typing.dataset.f, v:typing.dataset.v} : null;
  if(!state.dform) state.dform=freshForm(ctx);
  const f=state.dform, w=ctx.w;

  const chips=(key, opts, sel, multi, cls)=>`<div class="rchips">${opts.map(o=>
    `<button type="button" class="dchip${cls?" "+cls+o[0]:""}" data-f="${esc(key)}" data-v="${esc(o[0])}"
       aria-pressed="${multi ? sel.includes(o[0]) : sel===o[0]}">${esc(o[1])}</button>`).join("")}</div>`;

  const bugs=hatchChoices(w, f.date);
  const known=new Set(bugs.map(o=>o.hx.id));
  const extra=f.hatches.filter(id=>!known.has(id))
    .map(id=>HATCHES.find(h=>h.id===id)).filter(Boolean).map(hx=>({hx, inw:false, near:99}));
  const bugOpts=[...bugs, ...extra].map(o=>[o.hx.id, o.hx.name + (o.inw?"":" ·")]);

  const form=`
  <div class="dcard first">
    <div class="dhead"><h2>Log a day</h2><span class="dh-src">Feeds the plays</span></div>
    <p class="dintro">What actually happened out there is the one input Riffle cannot model. Write the day down and it comes back the next time you stand here at this point in the season — in how the plays are ranked, and in which bugs the hatch panel believes.</p>
    <p class="dwhere">Logging against <b>${esc(w.name)}</b>${w.place?` · ${esc(w.place)}`:""}. Pick a different water or spot on <b>Plan</b> to log that one instead.</p>

    <div class="dfield">
      <div class="dlab">Date</div>
      <input class="dinput date" type="date" id="dDate" value="${esc(f.date)}" max="${esc(isoLocal(new Date()))}">
    </div>

    <div class="dfield">
      <div class="dlab">How it went <span>— the one field the engine needs</span></div>
      ${chips("outcome", OUTCOMES.map(o=>[o.k,o.label]), f.outcome, false, "out-")}
    </div>

    <div class="dfield">
      <div class="dlab">What you fished <span>— tap every method you gave a fair go</span></div>
      ${chips("methods", METHODS.map(m=>[m.k,m.label]), f.methods, true)}
    </div>

    <div class="dfield">
      <div class="dlab">What you saw coming off ${bugOpts.length?`<span>— · marks one the calendar says is out of season</span>`:""}</div>
      ${bugOpts.length ? chips("hatches", bugOpts, f.hatches, true)
        : `<p class="dempty">No mapped hatch calendar for this water — put what you saw in the notes.</p>`}
    </div>

    <div class="dfield">
      <div class="dlab">Flies that actually caught</div>
      <input class="dinput" type="text" id="dFlies" value="${esc(f.flies)}" placeholder="Size 16 olive comparadun, black bugger">
    </div>

    <div class="dfield">
      <div class="dlab">Flow you saw</div>
      ${chips("cond.flow", FLOW_STATES.map(s=>[s.k,s.label]), f.cond.flow, false)}
    </div>
    <div class="dfield">
      <div class="dlab">Clarity</div>
      ${chips("cond.clarity", Object.values(CLARITY).map(c=>[c.k,c.label]), f.cond.clarity, false)}
    </div>
    <div class="dfield">
      <div class="dlab">Sky</div>
      ${chips("cond.sky", [["bright","Bluebird"],["partly","Partly cloudy"],["overcast","Overcast"]], f.cond.sky, false)}
    </div>

    <div class="dfield">
      <div class="dlab">Notes</div>
      <textarea class="dtext" id="dNotes" placeholder="Where the fish were sitting, what refused, what you would do differently.">${esc(f.notes)}</textarea>
    </div>

    <div class="dactions">
      <button type="button" class="dbtn" id="dSave">Save the day</button>
      <button type="button" class="dbtn ghost" id="dClear">Clear</button>
      ${state.dmsg?`<span class="dsaved${state.dmsg.bad?" warn":""}">${esc(state.dmsg.text)}</span>`:""}
    </div>
    ${state.diaryOK?"":`<div class="hint"><span>This browser will not let Riffle store anything, so a saved day lasts only until you close the tab. Export the book below if you want to keep it.</span></div>`}
  </div>`;

  /* --- what the book is doing to today's plays --- */

  /* The readout that explained what the diary was doing to the ranking
     lived here. The plays already say which days moved them and by how
     much, on the card where it matters, so this was the same account
     given twice — and it was given on the tab for writing the day down,
     which is not where you are reading tactics. */

  /* --- the days themselves --- */
  const entry=(e)=>{
    const o=OUTCOME_BY_KEY[e.outcome];
    const meth=e.methods.map(k=>METHOD_BY_KEY[k]&&METHOD_BY_KEY[k].label).filter(Boolean);
    const bugz=e.hatches.map(id=>{const h=HATCHES.find(x=>x.id===id); return h&&h.name;}).filter(Boolean);
    const cond=[e.cond.flow&&(FLOW_STATES.find(s=>s.k===e.cond.flow)||{}).label,
                e.cond.clarity&&(CLARITY[e.cond.clarity]||{}).label,
                e.cond.sky&&{bright:"Bluebird",partly:"Partly cloudy",overcast:"Overcast"}[e.cond.sky]].filter(Boolean);
    const nums=[e.temp!=null?`${Math.round(e.temp)} °F`:null, e.cfs!=null?`${e.cfs} cfs`:null].filter(Boolean);
    return `<div class="dentry">
      <div class="detop">
        <span class="dedate">${esc(fmtISO(e.date))}</span>
        <span class="dewater">${esc(e.water)}</span>
        <span class="deout ${esc(e.outcome)}">${esc(o.label)}</span>
      </div>
      ${(meth.length||bugz.length||cond.length||nums.length)?`<div class="demeta">
        ${meth.map(m=>`<span class="chip">${esc(m)}</span>`).join("")}
        ${bugz.map(b=>`<span class="chip hot">${esc(b)}</span>`).join("")}
        ${cond.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}
        ${nums.map(n=>`<span class="chip">${esc(n)}</span>`).join("")}
      </div>`:""}
      ${e.flies?`<p class="denote"><b>Caught on:</b> ${esc(e.flies)}</p>`:""}
      ${e.notes?`<p class="denote">${esc(e.notes)}</p>`:""}
      <button type="button" class="dedel" data-del="${esc(e.id)}">${state.dpend===e.id?"Delete this day — tap again":"Delete"}</button>
    </div>`;
  };
  const list=`
  <div class="dcard">
    <div class="dhead"><h2>Your days</h2>
      <span class="dh-src">${state.diary.length?`${state.diary.length} logged`:"none yet"}</span></div>
    ${state.diary.length ? state.diary.slice(0,60).map(entry).join("")
      : `<p class="dempty">Days you save show up here, newest first, and stay in this browser only — Riffle never sends them anywhere.</p>`}
    ${state.diary.length>60?`<p class="dempty" style="margin-top:9px">Showing the 60 most recent of ${state.diary.length}.</p>`:""}
    <div class="dactions">
      <button type="button" class="dbtn ghost" id="dExport">Export the book</button>
      <button type="button" class="dbtn ghost" id="dImport">Import</button>
      <input type="file" id="dFile" accept="application/json,.json" hidden>
    </div>
  </div>`;

  el.innerHTML = form + list;
  wireDiary(ctx);
  if(refocus){
    const back=el.querySelector(`.dchip[data-f="${refocus.f}"][data-v="${refocus.v}"]`);
    if(back) back.focus();                   // tapping a chip should not cost you your place
  }
}

function wireDiary(ctx){
  const f=state.dform;
  document.querySelectorAll("#diary .dchip").forEach(b=>{
    b.addEventListener("click",()=>{
      harvestDiaryForm();
      const key=b.dataset.f, v=b.dataset.v;
      if(key==="methods"||key==="hatches"){
        const arr=f[key];
        const i=arr.indexOf(v);
        if(i>=0) arr.splice(i,1); else arr.push(v);
      } else if(key.startsWith("cond.")){
        const k=key.slice(5);
        f.cond[k] = f.cond[k]===v ? null : v;
      } else {
        f[key] = f[key]===v ? null : v;
      }
      state.dmsg=null;
      renderDiary(ctx);
    });
  });
  const date=$("#dDate");
  if(date) date.addEventListener("change",()=>{ harvestDiaryForm(); renderDiary(ctx); });

  const save=$("#dSave");
  if(save) save.addEventListener("click",()=>{
    harvestDiaryForm();
    if(!f.outcome){
      state.dmsg={text:"Tell it how the day went first.", bad:true};
      renderDiary(ctx); return;
    }
    const w=ctx.w;
    state.diary.unshift(normEntry({
      date:f.date, waterId:w.id, hatchKey:hatchKeyOf(w), water:w.name, place:w.place,
      lat:w.lat, lon:w.lon, outcome:f.outcome, methods:f.methods.slice(), hatches:f.hatches.slice(),
      flies:f.flies, notes:f.notes, cond:{...f.cond},
      temp: f.date===isoLocal(new Date()) ? ctx.temp : null,
      cfs:  f.date===isoLocal(new Date()) ? ctx.cfs  : null,
    }));
    const ok=diarySave();
    state.diaryOK=ok;
    state.dform=freshForm(ctx);
    state.dmsg={text: ok?"Saved — the plays have been re-read.":"Held for this session only; the browser refused to store it.", bad:!ok};
    state.dredraw=true; draw(); state.dredraw=false;   // the whole app now reads the water differently
  });
  const clear=$("#dClear");
  if(clear) clear.addEventListener("click",()=>{ state.dform=freshForm(ctx); state.dmsg=null; renderDiary(ctx); });

  document.querySelectorAll("#diary .dedel").forEach(b=>{
    b.addEventListener("click",()=>{
      const id=b.dataset.del;
      if(state.dpend!==id){ state.dpend=id; renderDiary(ctx); return; }   // one tap to arm, one to delete
      state.diary=state.diary.filter(e=>e.id!==id);
      state.dpend=null; state.diaryOK=diarySave();
      draw();
    });
  });

  const exp=$("#dExport");
  if(exp) exp.addEventListener("click",()=>{
    const blob=new Blob([JSON.stringify(state.diary,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`riffle-diary-${isoLocal(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  });
  const imp=$("#dImport"), file=$("#dFile");
  if(imp && file){
    imp.addEventListener("click",()=>file.click());
    file.addEventListener("change",async ()=>{
      const fl=file.files&&file.files[0]; if(!fl) return;
      try{
        const j=JSON.parse(await fl.text());
        const add=(Array.isArray(j)?j:[]).filter(validEntry).map(normEntry);
        if(!add.length) throw new Error("nothing usable");
        const have=new Set(state.diary.map(e=>e.id));
        let n=0;
        for(const e of add) if(!have.has(e.id)){ state.diary.push(e); have.add(e.id); n++; }
        state.diaryOK=diarySave();
        state.dmsg={text:`Imported ${n} day${n===1?"":"s"}.`, bad:false};
      }catch(err){
        state.dmsg={text:"That file is not a Riffle diary export.", bad:true};
      }
      file.value="";
      draw();
    });
  }
}

/* --- the shops themselves ------------------------------------
   Looked up when the tab is opened rather than at startup: it is
   a second Overpass call, and most sessions never ask for it.
------------------------------------------------------------ */
function shopCentre(){
  const w=water();
  return state.pin ? {lat:state.pin.lat, lon:state.pin.lon, what:(state.pin.label||"your pin").split(",")[0].trim()}
                   : {lat:w.lat, lon:w.lon, what:w.name};
}

async function loadShops(){
  const c=shopCentre();
  const key=c.lat.toFixed(2)+","+c.lon.toFixed(2);
  const st=state.shops;
  if(st.key===key && (st.status==="ok"||st.status==="empty"||st.status==="loading")) return;
  state.shops={status:"loading", list:[], radius:0, key};
  renderShopsCard();
  try{
    /* A places directory first, OpenStreetMap second.
       OSM is a map of the landscape, and it is excellent at the things
       this app asks it for elsewhere — launches, access, trailheads.
       A fly shop is a business, and rural businesses are in OSM only
       where a volunteer mapped that storefront. For the West Branch,
       largely nobody has. So the directory answers when it is
       configured, and the map answers when it is not.

       25 miles is what "near" means on a river road; the wider pass
       costs a round trip only where the first found nothing. */
    let radius=40000;
    let list=await placesShops(c.lat, c.lon, radius);
    if(list===null){                                   // no key, or the service is down
      list=await flyShops(c.lat, c.lon, radius);
      if(!list.length){ radius=90000; list=await flyShops(c.lat, c.lon, radius); }
    } else if(!list.length){
      radius=90000; list=await placesShops(c.lat, c.lon, radius) || [];
    }
    state.shops={status:list.length?"ok":"empty", list, radius, key};
  }catch(e){
    state.shops={status:"error", list:[], radius:0, key:null};   // null key, so opening the tab tries again
  }
  renderShopsCard();
}

function shopRow(sh){
  const links=[
    sh.site?`<a href="${esc(sh.site)}" target="_blank" rel="noopener noreferrer">Website</a>`:"",
    sh.tel?`<a href="tel:${esc(sh.tel.replace(/[^0-9+]/g,""))}">${esc(sh.tel)}</a>`:"",
    `<a href="${esc(sh.map)}" target="_blank" rel="noopener noreferrer">Map</a>`,
  ].filter(Boolean).join("");
  return `<div class="shoprow">
    <span class="sn">${esc(sh.name)}
      <span>${esc(sh.kindLabel)}${sh.where?` \u00b7 ${esc(sh.where)}`:""}</span>
      <span class="shoplinks">${links}</span>
    </span>
    <span class="wd">${esc(milesOf(sh.dist))}</span>
  </div>`;
}

function renderShopsCard(){
  const el=$("#shopsCard"); if(!el) return;
  const st=state.shops, c=shopCentre();
  const head=`<h3>Fly shops near ${esc(c.what)}</h3>`;

  /* OpenStreetMap's coverage of rural fly shops is genuinely thin — a
     lodge on a river road is often not mapped at all, whatever it is
     called. No query fixes absent data, so the card always offers a way
     to go and look, and never implies the list is the whole truth. */
  const q = `fly shop near ${c.what}`;
  const findMore = `<p class="muted" style="margin-top:10px">
      OpenStreetMap misses plenty of river-road shops.
      <a href="https://duckduckgo.com/?q=${encodeURIComponent(q)}" target="_blank" rel="noopener noreferrer">Search for more near ${esc(c.what)}</a>.
    </p>`;

  if(st.status==="loading"){ el.innerHTML=head+`<p class="muted">Looking up shops…</p>`; return; }
  if(st.status==="error"){
    el.innerHTML=head+`<p class="muted">The OpenStreetMap lookup did not answer, so there is no shop list this time.</p>`+findMore;
    return;
  }
  if(st.status==="empty"){
    el.innerHTML=head+`<p class="muted">OpenStreetMap has nothing mapped within ${Math.round(st.radius/1609.34)} miles that reads as a fly shop. That is a gap in the map rather than a statement about the river — this stretch may well have several.</p>`+findMore;
    return;
  }
  if(st.status!=="ok"){ el.innerHTML=head+`<p class="muted">Opening this tab looks up the counters nearest the water you are reading.</p>`; return; }
  /* Three is the number you would actually ring round before a drive.
     Past that it is a directory, and the flies below are the point. */
  const near=st.list.slice(0,3);
  const rest=st.list.length-near.length;
  el.innerHTML=head
    + `<p class="muted">The ${near.length===1?"nearest":`nearest ${near.length===2?"two":"three"}`}, from OpenStreetMap. Call ahead — hours on a river road are their own thing.</p>`
    + near.map(shopRow).join("")
    + (rest>0?`<p class="muted" style="margin-top:9px">${rest} more ${rest===1?"is":"are"} mapped further out.</p>`:"")
    + findMore;
}

/* --- shop list --------------------------------------------- */
function renderShop(res, ctx){
  const flyMap=new Map(), tackMap=new Map();
  res.picked.forEach(p=>{
    p.flyGroups.forEach(g=>g.items.forEach(f=>{
      const k=f.name.toLowerCase().split(",")[0].trim();
      if(!flyMap.has(k)) flyMap.set(k,{...f, forr:new Set()});
      const cur=flyMap.get(k);
      cur.forr.add(p.rank);
      if(f.name.length>cur.name.length) cur.name=f.name;      // keep the more specific description
      if(f.note&&!cur.note) cur.note=f.note;
    }));
    (p.tackle||[]).forEach(t=>{
      if(!tackMap.has(t.key)) tackMap.set(t.key,{...t, forr:new Set()});
      tackMap.get(t.key).forr.add(p.rank);
    });
  });
  const flies=[...flyMap.values()];
  const tack=[...tackMap.values()];
  const group=(cat)=>tack.filter(t=>t.cat===cat);

  const item=(name,spec,forr,note,key)=>`
    <li class="sitem ${state.checked.has(key)?"on":""}" data-key="${esc(key)}">
      <span class="box"></span>
      <div class="sbody">
        <div class="sname">${esc(name)}</div>
        <div class="sspec">${esc(spec)}</div>
        ${note?`<div class="sfor">${esc(note)}</div>`:""}
        ${forr?`<div class="sfor">For play ${[...forr].sort().join(" and ")}</div>`:""}
      </div>
    </li>`;

  /* The shops come first, directly under the tabs: who is nearby and who
     to ask is the question you open this tab with, and the list of flies
     is what you take in once you know where you are going. */
  $("#panel-shop").innerHTML=`
    <div class="hint">
      <span>⚑</span>
      <span><b>Ask the shop one question:</b> “What came off the water here in the last two days?” A three-day-old report beats any model — including this one. If their answer contradicts a play on <b>Fish</b>, believe them and tap the matching chip on the Report tab.</span>
    </div>

    <div class="wcard" id="shopsCard"></div>

    <div class="wcard">
      <h3>Before you buy a fly</h3>
      <p>Consider hiring a local guide who knows the river, the correct tactics, and
         patterns. A day on the oars with someone who fished this water last week beats
         any amount of modelling — and beats a fly box bought on a guess.</p>
    </div>

    <div class="shop-intro">
      <h2>${ctx.outOfBook?"No list for this water":"What the plays call for"}</h2>
      ${ctx.outOfBook
        ? `<p>The list is built from the plays, and outside the book there are none — see <b>Fish</b> for why.
           The shops above are still real, and the people behind those counters know this water far better than
           any calendar would. Ask them what is coming off.</p>`
        : `<p>Everything the three plays need, in one list. Sizes and colours are specific on purpose — hand this to the shop and you are out the door in five minutes.
      ${esc(ctx.w.name)}, ${ctx.d.toLocaleDateString(undefined,{month:"long",day:"numeric"})}, water ${ctx.temp.toFixed(0)} °F, ${ctx.fs.label.toLowerCase()} flow, ${ctx.clarity.label.toLowerCase()}.</p>`}
    </div>

    <div class="shopcard">
      <h3>Flies — ${flies.length} patterns</h3>
      <ul class="slist">
        ${flies.map(f=>item(f.name, `${f.size} · ${f.qty} each`, f.forr, f.note, "f-"+f.name)).join("")}
      </ul>
    </div>

    ${group("leader").length?`<div class="shopcard"><h3>Leaders</h3><ul class="slist">
      ${group("leader").map(t=>item(t.name,t.spec,t.forr,"", t.key)).join("")}
    </ul></div>`:""}

    ${group("tippet").length?`<div class="shopcard"><h3>Tippet</h3><ul class="slist">
      ${group("tippet").map(t=>item(t.name,t.spec,t.forr,"", t.key)).join("")}
    </ul></div>`:""}

    ${group("weight").length?`<div class="shopcard"><h3>Weight, terminal & sundries</h3><ul class="slist">
      ${group("weight").map(t=>item(t.name,t.spec,t.forr,"", t.key)).join("")}
    </ul></div>`:""}

    `;

  renderShopsCard();
  /* Move the pin while the tab is open and the counters follow it;
     loadShops() is a no-op while the centre has not changed. */
  if(state.tab==="shop") loadShops();
  document.querySelectorAll(".sitem").forEach(li=>{
    li.addEventListener("click",()=>{
      const k=li.dataset.key;
      if(state.checked.has(k)) state.checked.delete(k); else state.checked.add(k);
      li.classList.toggle("on");
    });
  });
}

/* --- what is hatching, at the foot of Fish ------------------- */
function hatchHTML(res, ctx){
  const now=res.ah.filter(o=>o.i>0.28);
  const soon=HATCHES.filter(hx=>{
    if(ctx.w.sp!=="trout") return false;
    if(hx.waters!=="all"&&!hx.waters.includes(hatchKeyOf(ctx.w))) return false;
    const s=hx.win[0]+ctx.w.shift;
    return s>ctx.day && s<=ctx.day+28;
  }).sort((a,b)=>a.win[0]-b.win[0]);

  const row=(hx,i,dim)=>`
    <div class="hrow">
      <span class="swatch" style="background:${esc(hx.hex)};margin-top:0"></span>
      <span class="hname">${esc(hx.name)} <span class="hlat">${esc(hx.latin)}</span></span>
      <span class="hspec">${sizeStr(hx.size)}</span>
      <span class="hmeter ${dim?"dim":""}"><i style="width:${Math.round(clamp(i,0,1)*100)}%"></i></span>
    </div>`;

  const runsBlock = ctx.isGL && res.runs.length ? `
    <div class="hbar">
      <div class="sec-lab" style="margin-bottom:8px">In the river now</div>
      ${res.runs.map(o=>`
        <div class="hrow">
          <span class="hname">${esc(o.r.name)}</span>
          <span class="hmeter"><i style="width:${Math.round(o.i*100)}%"></i></span>
        </div>`).join("")}
    </div>` : "";

  return `
    <div class="shop-intro" id="hatchIntro">
      <h2>What is on the water</h2>
      <p>Windows are shifted ${ctx.w.shift===0?"to the Catskill baseline":`${Math.abs(ctx.w.shift)} days ${ctx.w.shift>0?"later":"earlier"} than the Catskill baseline`} for ${esc(ctx.w.name)}, and damped when the modeled water temperature sits outside each insect's trigger range.</p>
    </div>
    ${runsBlock}
    ${now.length?`<div class="hbar">
      <div class="sec-lab" style="margin-bottom:8px">On now</div>
      ${now.map(o=>row(o.hx,o.i,false)).join("")}
    </div>`:`<div class="hbar"><p style="margin:0;font-size:13.5px;color:var(--ink2)">Nothing significant is emerging on this date. Fish subsurface — the plays above are built for exactly that.</p></div>`}
    ${soon.length?`<div class="hbar">
      <div class="sec-lab" style="margin-bottom:8px">Starting within four weeks</div>
      ${soon.map(hx=>`<div class="hrow">
        <span class="swatch" style="background:${esc(hx.hex)};margin-top:0"></span>
        <span class="hname">${esc(hx.name)} <span class="hlat">${esc(hx.latin)}</span></span>
        <span class="hspec">${dayLabel(hx.win[0]+ctx.w.shift)}</span>
      </div>`).join("")}
    </div>`:""}`;
}
function dayLabel(dn){
  const d=new Date(new Date().getFullYear(),0,1); d.setDate(dn);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

/* --- water tab ---------------------------------------------- */
function haversine(a,b,c,d){
  const R=3959, r=Math.PI/180;
  const dLat=(c-a)*r, dLon=(d-b)*r;
  const h=Math.sin(dLat/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}
/* --- the Plan panel — where are you fishing? -----------------
   The map is expensive to build and must survive the ten-minute
   redraw, so the shell is rendered once and only the cards
   around the map are re-rendered. The book of waters sits
   directly under the map: point at a place, and the answer to
   "what is near here?" is the next thing you read.
------------------------------------------------------------ */
let whereMap=null, pinMarker=null, accLayer=null, whereBuilt=false, mapDead=false;

function whereShell(){
  if(whereBuilt) return;
  $("#panel-plan").innerHTML=`
    <!-- Which day, then which water. Picking the day is the first decision
         of a trip, and it re-reads every other panel. -->
    <section class="plan when" id="whenbar"></section>
    <div class="wcard">
      <h3>Where are you fishing?</h3>
      <p>Search an address, a town or a water — or tap the map to drop a pin. Riffle then looks up the
         public access mapped around that point and reads the river from the nearest gauge.</p>
      <form class="findrow" id="findForm" role="search">
        <input id="findQ" type="search" autocomplete="off" spellcheck="false"
               placeholder="Address, town, or water" aria-label="Address, town, or water">
        <button class="findbtn" type="submit">Find</button>
        <button class="findbtn ghost" type="button" id="findMe" title="Use my location">Near me</button>
      </form>
      <div id="findOut" class="findout" aria-live="polite"></div>
    </div>
    <div class="wcard mapcard" id="mapCard">
      <div id="map" role="application" aria-label="Map. Tap to choose where you are fishing."></div>
      <p class="mapnote" id="mapNote">Tap the map to move the pin.</p>
    </div>
    <div id="riverCard"></div>
    <div id="nearWaters"></div>
    <div class="wcard" id="accessCard"></div>`;
  wireWhere();
  whereBuilt=true;
}

function wireWhere(){
  $("#findForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const q=$("#findQ").value.trim();
    if(!q) return;
    const out=$("#findOut");
    out.innerHTML=`<p class="muted">Searching…</p>`;
    try{
      const hits=await geocode(q);
      if(!hits.length){ out.innerHTML=`<p class="muted">Nothing found for “${esc(q)}”. Try a town and state, or tap the map.</p>`; return; }
      if(hits.length===1){ out.innerHTML=""; setPin(hits[0].lat, hits[0].lon, hits[0].short); return; }
      out.innerHTML=`<div class="wlist">${hits.map((h,i)=>
        `<button class="wbtn geo" data-i="${i}"><span class="wn">${esc(h.short)}<span class="wt">${esc(h.label)}</span></span></button>`).join("")}</div>`;
      out.querySelectorAll(".geo").forEach(b=>b.addEventListener("click",()=>{
        const h=hits[+b.dataset.i]; out.innerHTML=""; $("#findQ").value=h.short;
        setPin(h.lat, h.lon, h.short);
      }));
    }catch(err){
      out.innerHTML=`<p class="muted">The address lookup did not answer. Check the connection, or tap the map instead.</p>`;
    }
  });
  $("#findMe").addEventListener("click", ()=>locate(true));
}

/* "pending" until the deferred tag settles, so a fast tap on Where waits
   for the library instead of condemning the map on a race. */
let leafletState = "pending";
function watchLeaflet(){
  if(typeof L!=="undefined"){ leafletState="ready"; return; }
  const tag=document.getElementById("leaflet");
  if(!tag){ leafletState="failed"; return; }
  const settle=(st)=>()=>{ leafletState=st; if(state.tab==="plan") initMap(); };
  tag.addEventListener("load",  settle("ready"),  {once:true});
  tag.addEventListener("error", settle("failed"), {once:true});
}

function initMap(){
  if(whereMap || mapDead) return;
  if(typeof L==="undefined"){
    if(leafletState==="pending") return;      // still coming — the load handler calls back
    mapDead=true;
    const c=$("#mapCard"); if(c) c.innerHTML=`<p class="muted">The map library did not load. Search an address above — everything else still works.</p>`;
    return;
  }
  const start = state.pin || {lat:water().lat, lon:water().lon};
  whereMap = L.map("map", {scrollWheelZoom:false}).setView([start.lat, start.lon], state.pin?12:10);
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {maxZoom:18, attribution:"&copy; OpenStreetMap contributors"}).addTo(whereMap);
  accLayer = L.layerGroup().addTo(whereMap);
  whereMap.on("click", e=> setPin(e.latlng.lat, e.latlng.lng, null));
  let tileFails=0;
  tiles.on("tileerror", ()=>{                      // fires on the layer, never on the map
    if(++tileFails===3){
      const n=$("#mapNote");
      if(n) n.innerHTML=`Map tiles are blocked here, so the map is blank — the pin and the access lookup still work.`;
    }
  });
  if(state.pin) drawPin();
}

function whereShown(){
  whereShell(); initMap();
  if(whereMap) setTimeout(()=>whereMap.invalidateSize(), 30);
}

function drawPin(){
  if(!whereMap || !state.pin) return;
  const ll=[state.pin.lat, state.pin.lon];
  if(!pinMarker){
    pinMarker=L.marker(ll, {draggable:true, icon:L.divIcon({className:"pin-i", html:'<i></i>', iconSize:[20,20], iconAnchor:[10,10]})}).addTo(whereMap);
    pinMarker.on("dragend", ()=>{ const p=pinMarker.getLatLng(); setPin(p.lat, p.lng, null); });
  } else pinMarker.setLatLng(ll);
  whereMap.setView(ll, Math.max(whereMap.getZoom(), 12));
}

function plotAccess(){
  if(!whereMap || !accLayer) return;
  accLayer.clearLayers();
  for(const a of (state.access.list||[])){
    const m=L.marker([a.lat,a.lon], {icon:L.divIcon({className:"acc-i", html:`<i class="k-${a.kind}"></i>`, iconSize:[14,14], iconAnchor:[7,7]})});
    /* OSM tags are world-writable: anyone may set the name of a node to
       anything, and Leaflet renders a string tooltip as HTML. So the label
       goes in as a text node. Everywhere else in the app untrusted text
       passes through esc(); this was the one sink that did not. */
    const tip=document.createElement("span");
    tip.textContent=`${a.name||ACCESS_KINDS[a.kind].label}${a.waterway?" · "+a.waterway:""}`;
    m.bindTooltip(tip);
    m.on("click", ()=>chooseAccess(a.id));
    m.addTo(accLayer);
  }
}

async function setPin(lat, lon, label){
  state.pin={lat, lon, label:label||null};
  drawPin();
  renderAccessCard();
  draw();                       // the book re-sorts around the new point immediately
  if(!label){
    reverseGeocode(lat,lon).then(name=>{
      if(name && state.pin && state.pin.lat===lat && state.pin.lon===lon){
        state.pin.label=name; renderAccessCard(); draw();
      }
    });
  }
  loadRivers(lat, lon);          // the river list and the access list are independent asks
  await loadAccess(lat, lon);
}

/* The rivers around the pin, and which one the angler picked. Kept off the
   access lookup deliberately: Overpass being slow or down should not stop
   USGS answering, and the river list is the more important of the two. */
async function loadRivers(lat, lon){
  const key = lat.toFixed(3)+","+lon.toFixed(3);
  if(state.rivers.key===key && state.rivers.status==="ok") return;
  state.rivers={status:"loading", list:[], key};
  renderRiverCard();
  let list=[];
  try{ list = await nearbyRivers(lat, lon); }
  catch(e){ state.rivers={status:"error", list:[], key}; renderRiverCard(); return; }
  if(state.rivers.key!==key) return;                 // the pin moved while we asked
  state.rivers={status: list.length?"ok":"empty", list, key};
  renderRiverCard();
}

async function loadAccess(lat, lon){
  state.access={status:"loading", list:[], radius:8000, chosen:state.access.chosen};
  renderAccessCard();
  try{
    let list=await accessPoints(lat, lon, 8000), radius=8000;
    if(!list.length){ list=await accessPoints(lat, lon, 20000); radius=20000; }
    state.access={status: list.length?"ok":"empty", list, radius, chosen:state.access.chosen};
  }catch(e){
    state.access={status:"error", list:[], radius:8000, chosen:state.access.chosen};
  }
  renderAccessCard();
  plotAccess();
}

async function chooseAccess(id){
  const a=(state.access.list||[]).find(x=>x.id===id);
  if(!a) return;
  state.access.chosen=id;
  const name = a.name || (ACCESS_KINDS[a.kind].label + (a.waterway ? " on "+a.waterway : ""));
  await selectSpot({lat:a.lat, lon:a.lon, name, place: state.pin && state.pin.label || ""});
}

async function selectSpot(point){
  const card=$("#accessCard");
  if(card) card.setAttribute("aria-busy","true");
  try{
    state.spot = await buildSpot(point);
    state.live=null; state.baro=null;
    draw();
    refreshLive(water());
  }finally{
    const c=$("#accessCard"); if(c) c.removeAttribute("aria-busy");
  }
}

function milesOf(m){
  const mi=m/1609.34;
  return mi<0.1 ? Math.round(m)+" m" : (mi<10 ? mi.toFixed(1) : Math.round(mi))+" mi";
}

/* --- the rivers around the pin ------------------------------
   The list an angler wants after typing a town, and the one thing
   in this app that was never going to come from a curated table.
   Every row is a USGS gauge: a real river, with live flow, that
   Riffle can actually read. Picking one hands the plays that gauge.

   The fishery is the angler's to say. Riffle offers steelhead only
   where a Great Lakes run is plausible and never assumes it — the
   whole Montana bug was the app deciding on its own that a trout
   river was a steelhead river.
------------------------------------------------------------ */
function glPlausible(lat, lon){
  // Great Lakes drainage, roughly: the lakes and the country that drains to them
  return lat>=41.0 && lat<=47.5 && lon>=-92.5 && lon<=-74.5;
}

function renderRiverCard(){
  const el=$("#riverCard"); if(!el) return;
  const st=state.rivers||{status:"idle"};
  const where = state.pin ? (state.pin.label ? String(state.pin.label).split(",")[0].trim()
                                             : `${state.pin.lat.toFixed(3)}, ${state.pin.lon.toFixed(3)}`) : null;
  if(!state.pin || st.status==="idle"){ el.innerHTML=""; return; }
  const head=`<h3>Rivers near ${esc(where)}</h3>`;
  const wrap=(inner)=>{ el.innerHTML=`<div class="wcard">${head}${inner}</div>`; };

  if(st.status==="loading"){ wrap(`<p class="muted">Asking USGS which rivers here have a gauge on them…</p>`); return; }
  if(st.status==="error"){
    wrap(`<p class="muted">The USGS site lookup did not answer. The book below still works, and the pin itself can be read.</p>`);
    return;
  }
  if(st.status==="empty"){
    wrap(`<p class="muted">USGS has no gauged stream within about 50 miles of that point. Riffle can only read a river
      that reports its flow, so there is nothing here to pick — move the pin, or use the book below.</p>`);
    return;
  }

  const cur = state.spot && state.spot.gauge;
  const gl  = glPlausible(state.pin.lat, state.pin.lon);
  const east = inEast(state.pin.lat, state.pin.lon);
  wrap(`
    <p>${st.list.length} gauged river${st.list.length===1?"":"s"} around that point, from USGS — nearest first.
       Pick one and its gauge becomes the flow and water temperature the plays read.</p>
    <div class="wlist">
      ${st.list.map(r=>`
        <button class="wbtn rvbtn" data-g="${esc(r.id)}" aria-current="${cur===r.id}">
          <span class="wn">${esc(r.river)}<span class="wt">USGS ${esc(r.id)}${r.area?` · ${Math.round(r.area).toLocaleString()} sq mi`:""}</span></span>
          <span class="wd">${milesOf(r.dist)}</span>
        </button>`).join("")}
    </div>
    ${gl?`<div class="dactions">
      <button type="button" class="dbtn ghost" id="rvSp" data-sp="${state.rivers.sp==="steelhead"?"trout":"steelhead"}">
        Read these as ${state.rivers.sp==="steelhead"?"trout water":"a Great Lakes run"}</button></div>
      <p class="muted">Currently reading them as <b>${state.rivers.sp==="steelhead"?"steelhead and salmon water":"trout water"}</b>.
         Many rivers here are both, at different times of year — Riffle will not guess which you mean.</p>`:""}
    ${!east?`<p class="muted">These gauges are real and Riffle will read them, but this point is outside the range of
       the eastern hatches the book carries, so the hatch chart and the plays that need it stay off.</p>`:""}`);

  const sp=$("#rvSp");
  if(sp) sp.addEventListener("click", async ()=>{
    state.rivers.sp = sp.dataset.sp;
    if(state.spot && state.spot.pickedGauge){        // re-read the chosen river as the other fishery
      const r=(state.rivers.list||[]).find(x=>x.id===state.spot.pickedGauge);
      if(r) return chooseRiver(r.id);
    }
    renderRiverCard();
  });

  document.querySelectorAll("#riverCard .rvbtn").forEach(b=>b.addEventListener("click", ()=>chooseRiver(b.dataset.g)));
}

async function chooseRiver(gaugeId){
  const r=(state.rivers.list||[]).find(x=>x.id===gaugeId);
  if(!r) return;
  const card=$("#riverCard"); if(card) card.setAttribute("aria-busy","true");
  try{
    await selectSpot({
      lat:r.lat, lon:r.lon, name:r.river, place:(state.pin&&state.pin.label)||"",
      sp: state.rivers.sp==="steelhead" ? "steelhead" : "trout",
      gauge:{id:r.id, name:r.station, lat:r.lat, lon:r.lon, area:r.area, dist:0},
      pickedGauge:r.id,
    });
  } finally {
    const c=$("#riverCard"); if(c) c.removeAttribute("aria-busy");
  }
}

function renderAccessCard(){
  const el=$("#accessCard"); if(!el) return;
  const st=state.access||{status:"idle"};
  const where = state.pin ? (state.pin.label || `${state.pin.lat.toFixed(3)}, ${state.pin.lon.toFixed(3)}`) : null;

  if(!state.pin){
    el.innerHTML=`<h3>Public access</h3><p class="muted">Drop a pin or search an address and Riffle will list the access mapped nearby.</p>`;
    return;
  }
  const head=`<h3>Public access near ${esc(where)}</h3>`;
  if(st.status==="loading"){ el.innerHTML=head+`<p class="muted">Looking up mapped access…</p>`; return; }
  if(st.status==="error"){
    el.innerHTML=head+`<p class="muted">The OpenStreetMap lookup did not answer. Try again, or read the pin itself.</p>`
      + `<div class="wlist">${pinRowHTML()}</div>`;
    wireAccessRows(); return;
  }
  if(st.status==="empty"){
    el.innerHTML=head+`<p class="muted">Nothing is mapped as access within ${Math.round(st.radius/1609.34)} miles of that pin.
      That means OpenStreetMap has no record here — not that there is none.</p>
      <div class="wlist">${pinRowHTML()}</div>`;
    wireAccessRows(); return;
  }
  el.innerHTML = head
    + `<p class="muted">From OpenStreetMap, within ${Math.round(st.radius/1609.34)} miles. Tap one to read that water.</p>`
    + `<div class="wlist">${st.list.map(a=>`
        <button class="wbtn apt" data-a="${esc(a.id)}" aria-current="${st.chosen===a.id}">
          <span class="akind k-${a.kind}">${esc(ACCESS_KINDS[a.kind].label)}</span>
          <span class="wn">${esc(a.name||ACCESS_KINDS[a.kind].label)}
            <span class="wt">${a.waterway?esc(a.waterway):esc(ACCESS_KINDS[a.kind].hint)}${a.fee?" · fee":""}</span></span>
          <span class="wd">${esc(milesOf(a.dist))}</span>
        </button>`).join("")}
        ${pinRowHTML()}</div>`
    + `<div class="hint" role="note">
        <span>\u26A0</span>
        <span><b>Check before you park.</b> These are features mapped in OpenStreetMap — a launch, a lot,
          a trailhead. They are not a statement that the bank is public or that fishing is permitted.
          Verify with the state agency or posted signs.</span>
       </div>`;
  wireAccessRows();
}

function pinRowHTML(){
  return `<button class="wbtn apt" data-a="__pin__" aria-current="${state.access.chosen==="__pin__"}">
      <span class="akind k-pin">Pin</span>
      <span class="wn">Read the pin itself<span class="wt">Skip the access list and read the water at the marker</span></span>
    </button>`;
}

function wireAccessRows(){
  document.querySelectorAll(".apt").forEach(b=>b.addEventListener("click", async ()=>{
    const id=b.dataset.a;
    if(id==="__pin__"){
      state.access.chosen="__pin__";
      await selectSpot({lat:state.pin.lat, lon:state.pin.lon,
        name: state.pin.label || "Your pin", place:""});
    } else await chooseAccess(id);
  }));
}

function renderWater(ctx){
  whereShell();
  if(state.tab==="plan") initMap();
  renderAccessCard();

  const g=state.geo;
  /* The book re-sorts around wherever the angler last pointed — a
     searched address, a dropped pin, an access point they picked —
     and only falls back to the device location when they have
     pointed nowhere at all. Asking "what else is near here?" about
     a place you are not standing in is most of the point of Where. */
  const short=(t)=>String(t||"").split(",")[0].trim();      // a heading wants the town, not the postal address
  const from = state.pin ? {lat:state.pin.lat, lon:state.pin.lon, what:short(state.pin.label)||"your pin"}
             : g        ? {lat:g.lat, lon:g.lon, what:"your location"}
             : null;
  /* The book and the named waters go in one list, sorted by distance, because
     the question is "what is near me" and not "which of these did someone hand-
     write". What separates them travels with each row instead: a book water
     names the gauge it was built around, a named one says it is read live. */
  const rows=[...WATERS.map(w=>({w, named:false})), ...NAMED.map(w=>({w, named:true}))];
  const list=rows.map(o=>({...o, d:from?haversine(from.lat,from.lon,o.w.lat,o.w.lon):null}))
    .sort((a,b)=> from ? a.d-b.d : (a.w.sp===b.w.sp ? a.w.name.localeCompare(b.w.name) : (a.w.sp==="trout"?-1:1)));

  /* Nearest first, directly under the map — the answer to the question
     the map has just been asked. Everything about how the reading was
     built now travels with the reading itself, on Fish.

     Only the near end is open, because sixty-nine rows between the
     map and the access list is a wall rather than an answer; the rest
     is one tap away, and the water being read is always in view. */
  const NEAR_OPEN=8;
  const shownList = state.nearAll ? list
    : list.filter((o,i)=> i<NEAR_OPEN || o.w.id===ctx.w.id);
  const hidden = list.length - shownList.length;
  /* Past this the book is not a list of places to fish this weekend, and
     saying "nearest waters to Baldwin" over a river 300 miles away is the
     app talking about itself instead of about the water. */
  const FAR_BOOK = 150;
  const nearestMi = from && list.length && list[0].d!=null ? list[0].d : 0;
  $("#nearWaters").innerHTML=`
    <div class="wcard">
      <h3>${!from || nearestMi>FAR_BOOK ? "Waters in the book" : `Nearest waters to ${esc(from.what)}`}</h3>
      <p>${nearestMi>FAR_BOOK
          ? `The book itself is a Northeast one and its nearest water is <b>${nearestMi} miles</b> away, so these
             are here to read, not to drive to. The rivers around your pin are in the card above.`
          : ctx.w.spot
          ? `Reading <b>${esc(ctx.w.name)}</b>, picked off the map. Tap a water below to read that one instead.`
          : from
          ? `Reading <b>${esc(ctx.w.name)}</b> \u2014 <b>${haversine(from.lat,from.lon,ctx.w.lat,ctx.w.lon)} miles</b> from ${esc(from.what)}.`
          : `Location is off, so Riffle opened on <b>${esc(ctx.w.name)}</b>. Search above, tap the map, or pick from the list.`}</p>
      <div class="wlist">
        ${shownList.map(({w,d,named})=>`
          <button class="wbtn" data-w="${w.id}"${named?` data-named="1" data-lat="${w.lat}" data-lon="${w.lon}" data-sp="${esc(w.sp)}"`:""}
                  aria-current="${named ? (!!ctx.w.spot && ctx.w.name===w.name) : (!ctx.w.spot&&w.id===ctx.w.id)}">
            <span class="wn">${esc(w.name)}<span class="wt">${esc(w.place)} · ${named?"read live":esc(w.type==="gl-trib"?"Great Lakes tributary":w.type)}</span></span>
            ${d!=null?`<span class="wd">${d} mi</span>`:""}
          </button>`).join("")}
      </div>
      ${shownList.some(o=>o.named)?`<p class="muted">Rows marked <b>read live</b> are not in the hand-written book.
         Riffle reads their gauge from USGS when you tap one and borrows the nearest written water's
         seasonal curves — the card then says which gauge it found and what it borrowed.</p>`:""}
      ${hidden>0?`<div class="dactions"><button type="button" class="dbtn ghost" id="nearMore">Show all ${list.length} waters</button></div>`
        : state.nearAll?`<div class="dactions"><button type="button" class="dbtn ghost" id="nearLess">Show the nearest ${NEAR_OPEN}</button></div>`:""}
    </div>`;
  const more=$("#nearMore"), less=$("#nearLess");
  if(more) more.addEventListener("click",()=>{ state.nearAll=true; draw(); });
  if(less) less.addEventListener("click",()=>{ state.nearAll=false; draw(); });

  document.querySelectorAll("#nearWaters .wbtn").forEach(b=>b.addEventListener("click",async()=>{
    state.access.chosen=null;
    if(b.dataset.named){
      /* A named water has no bands of its own, so it is read the way a pin is
         read: find its gauge, borrow the nearest hand-written water's curves,
         and say so. That takes a round trip, so the row is marked busy. */
      b.setAttribute("aria-busy","true");
      const n=NAMED.find(w=>w.id===b.dataset.w);
      try{ await selectSpot({lat:+b.dataset.lat, lon:+b.dataset.lon, sp:b.dataset.sp,
                             name:n?n.name:b.dataset.w, place:n?n.place:""}); }
      finally{ const el=document.querySelector(`#nearWaters .wbtn[data-w="${CSS.escape(b.dataset.w)}"]`);
               if(el) el.removeAttribute("aria-busy"); }
      return;
    }
    state.waterId=b.dataset.w; state.spot=null;
    state.live=null; state.baro=null; draw();
    refreshLive(water());
  }));
}

/* --- masthead current ribbon -------------------------------- */
function seam(){
  const c=document.getElementById("seam"); if(!c) return;
  const ctx2=c.getContext("2d"); if(!ctx2) return;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0, raf=null;
  function size(){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    c.width=c.clientWidth*dpr; c.height=86*dpr; ctx2.setTransform(dpr,0,0,dpr,0,0);
  }
  function paint(){
    const W=c.clientWidth, H=86;
    const cs=getComputedStyle(document.documentElement);
    const ink=cs.getPropertyValue("--line").trim()||"#ccc";
    const acc=cs.getPropertyValue("--accent").trim()||"#c74e19";
    ctx2.clearRect(0,0,W,H);
    for(let i=0;i<11;i++){
      const y=10+i*7.2;
      const amp=3+ (i%4)*2.1, speed=.5+ (i%5)*.13, ph=i*1.7;
      ctx2.beginPath();
      for(let x=0;x<=W;x+=6){
        const yy=y+Math.sin(x/64 + t*speed + ph)*amp + Math.sin(x/23 - t*speed*.6)*1.3;
        x===0?ctx2.moveTo(x,yy):ctx2.lineTo(x,yy);
      }
      ctx2.strokeStyle = i===6 ? acc : ink;
      ctx2.globalAlpha = i===6 ? .5 : .34;
      ctx2.lineWidth = i===6 ? 1.4 : 1;
      ctx2.stroke();
    }
    ctx2.globalAlpha=1;
  }
  function loop(){ t+=0.011; paint(); raf=requestAnimationFrame(loop); }
  /* This app lives in a pocket on a riverbank. A canvas repainting every
     frame behind a locked screen is battery spent on nothing. */
  function start(){ if(raf||reduce) return; raf=requestAnimationFrame(loop); }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf=null; }
  size(); paint();
  start();
  document.addEventListener("visibilitychange", ()=> document.hidden ? stop() : start());
  window.addEventListener("resize",()=>{ size(); paint(); });
}

/* --- tabs / theme / location -------------------------------- */
function wireTabs(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click",()=>{
      state.tab=t.id.replace("tab-","");
      document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t));
      document.querySelectorAll(".panel").forEach(p=>{ p.hidden = p.id!=="panel-"+state.tab; });
      if(state.tab==="plan") whereShown();
      if(state.tab==="shop") loadShops();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  });
}
function wireChrome(){
  $("#themeBtn").addEventListener("click",()=>{
    const r=document.documentElement;
    const cur=r.getAttribute("data-theme");
    const prefersDark=window.matchMedia("(prefers-color-scheme: dark)").matches;
    const next = cur ? (cur==="dark"?"light":"dark") : (prefersDark?"light":"dark");
    r.setAttribute("data-theme",next);
  });
  $("#locBtn").addEventListener("click",()=>locate(true));
}
function locate(explicit){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    state.geo={lat:pos.coords.latitude, lon:pos.coords.longitude};
    if(!state.spot){
      let best=null,bd=1e9;
      for(const w of WATERS){
        const d=haversine(state.geo.lat,state.geo.lon,w.lat,w.lon);
        if(d<bd){bd=d;best=w;}
      }
      /* The same distance question the pin path asks. A curated water is
         never "outside the book" — it IS the book — so opening on the
         nearest one put a phone in Bozeman on Conneaut Creek, 1,554 miles
         off, with its steelhead run and its hatch chart intact. Beyond the
         book's reach, open on nothing and let Plan say how far away it is. */
      if(best && inEast(state.geo.lat, state.geo.lon)){
        state.waterId=best.id; state.live=null; state.baro=null; refreshLive(best);
      }
    }
    draw();
    if(explicit){
      showTab("plan");
      setPin(state.geo.lat, state.geo.lon, "Your location");
    }
  },()=>{ if(explicit) draw(); },{timeout:8000, maximumAge:600000});
}

function showTab(name){
  const t=document.getElementById("tab-"+name);
  if(t) t.click();
}

let tick=null;
function draw(){
  state.when=plannedWhen();
  /* The day picker lives inside the Plan panel now, and the app opens on
     Plan — so the panel has to exist before renderPlanBar writes into it.
     whereShell() is idempotent; after the first call this costs nothing. */
  whereShell();
  const ctx=buildContext();
  const res=recommend(ctx);
  renderPlanBar(ctx);
  renderControls(ctx);
  renderFish(res,ctx);
  renderShop(res,ctx);
  renderWater(ctx);
  renderRiverCard();
  renderDiary(ctx);
  warmShops();
}

/* The counters are looked up from a centre the app already knows, so
   there is no reason to wait for the tab to be opened and then make the
   angler watch it load. Debounced, because dragging the pin redraws on
   every frame and Overpass is run by volunteers. loadShops() is a no-op
   once the centre has already been answered. */
let shopWarm=null;
function warmShops(){
  clearTimeout(shopWarm);
  shopWarm=setTimeout(()=>{ loadShops(); }, 1200);
}

(function init(){
  seam(); watchLeaflet(); wireTabs(); wireChrome();
  state.diaryOK = diaryUsable();
  state.diary   = diaryLoad();     // the book is open before the first reading is taken
  draw();
  if(state.tab==="plan") whereShown();   // the opening tab carries the map
  locate(false);
  refreshLive(water());
  tick=setInterval(()=>{ if(!document.hidden) draw(); }, 10*60*1000);
  /* A tab left open on the bank should not show an hour-old clock for ten
     minutes after you pick the phone back up. */
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) draw(); });
})();
</script>
