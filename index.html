<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Riffle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EDF1EC; --surface:#FFFFFF; --raised:#E2E8E1; --sunk:#DAE1D9;
  --line:#C9D2CA; --line-soft:#DDE4DC;
  --ink:#141E1B; --ink2:#495852; --ink3:#6E7D77;
  --accent:#C74E19; --accent-ink:#C74E19; --accent-soft:#FAE6DB;
  --verd:#2C7B69; --verd-soft:#DCEDE8;
  --sulphur:#A8790A; --sulphur-soft:#F7EBCD;
  --copper:#8F5426;
  --ring:rgba(0,0,0,.20);
  --shadow:0 1px 2px rgba(20,30,27,.06), 0 8px 24px -12px rgba(20,30,27,.18);
  --shadow-lift:0 2px 4px rgba(20,30,27,.08), 0 16px 40px -16px rgba(20,30,27,.28);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1517; --surface:#151F22; --raised:#1C282B; --sunk:#111A1C;
    --line:#2A393C; --line-soft:#222F32;
    --ink:#E7EEEA; --ink2:#A2B1AC; --ink3:#7A8985;
    --accent:#F0703A; --accent-ink:#FF8552; --accent-soft:#3A1F14;
    --verd:#4EB49A; --verd-soft:#10312B;
    --sulphur:#E0B040; --sulphur-soft:#31280F;
    --copper:#C98650; --ring:rgba(255,255,255,.32);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 16px 40px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0D1517; --surface:#151F22; --raised:#1C282B; --sunk:#111A1C;
  --line:#2A393C; --line-soft:#222F32;
  --ink:#E7EEEA; --ink2:#A2B1AC; --ink3:#7A8985;
  --accent:#F0703A; --accent-ink:#FF8552; --accent-soft:#3A1F14;
  --verd:#4EB49A; --verd-soft:#10312B;
  --sulphur:#E0B040; --sulphur-soft:#31280F;
  --copper:#C98650; --ring:rgba(255,255,255,.32);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5), 0 16px 40px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 120px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ---------- masthead ---------- */
.mast{position:relative;margin:0 -16px;padding:0;overflow:hidden;border-bottom:1px solid var(--line)}
#seam{display:block;width:100%;height:86px}
.mast-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{
  font-family:Fraunces,Georgia,serif;font-weight:700;font-size:32px;letter-spacing:-.02em;
  margin:0;line-height:1;font-variation-settings:"SOFT" 0,"WONK" 1;
}
.brand .tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.mast-right{display:flex;align-items:center;gap:8px}
.icon-btn{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--ink2);
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- reading panel ---------- */
.reading{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-top:16px;box-shadow:var(--shadow);overflow:hidden;
}
.rd-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px 12px}
.rd-water{min-width:0}
.rd-water h2{
  font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;margin:0;line-height:1.15;
  letter-spacing:-.01em;text-wrap:balance;
}
.rd-sub{font-size:12.5px;color:var(--ink3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.srcpill{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink3);flex:none;
}
.srcpill.live{border-color:var(--verd);color:var(--verd);background:var(--verd-soft)}

/* two strips: which water, above the tabs — which day, below them */
.plan{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  margin-top:16px;box-shadow:var(--shadow);overflow:hidden;
}
.plan.when{margin-top:14px}
.plan.when .pb-when{border-top:0}
.pb-id{padding:13px 16px 11px}
.pb-id h2{
  font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;margin:0;
  line-height:1.15;letter-spacing:-.015em;text-wrap:balance;
}
.pb-when{padding:12px 16px 13px;border-top:1px solid var(--line-soft);background:var(--sunk)}
.pb-when .dlab{margin-bottom:7px}
.pb-fields{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.pb-fields .dinput.date{flex:none;padding:6px 9px}
.pb-fields .dbtn{padding:6px 12px;font-size:12px}
.pb-lead{margin:9px 0 0;font-size:12px;color:var(--ink3);line-height:1.5}
.pb-lead b{color:var(--ink2);font-weight:600}
.srcpill.carried{border-color:var(--sulphur);color:var(--sulphur);background:var(--sulphur-soft)}
/* The day picker lives on Plan, so every other tab needs to say when it is
   reading for — otherwise a planned day looks like a wrong one. */
.srcpill.plan{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.reading.tactic{margin-top:16px}
.reading.tactic .access{border-top:0}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-soft)}
.g{padding:11px 8px 12px;border-right:1px solid var(--line-soft);text-align:center}
.g:last-child{border-right:0}
.g .lab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.g .val{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.g .note{font-size:10.5px;color:var(--ink2);margin-top:4px;line-height:1.25}
.g.warn .val{color:var(--sulphur)}
.g.bad .val{color:var(--accent-ink)}
.g.good .val{color:var(--verd)}

/* access band */
.access{padding:13px 16px 14px;border-top:1px solid var(--line-soft);background:var(--sunk)}
.acc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.acc-call{
  font-family:Fraunces,Georgia,serif;font-size:25px;font-weight:700;line-height:1;letter-spacing:-.02em;
}
.acc-call.good{color:var(--verd)} .acc-call.warn{color:var(--sulphur)} .acc-call.bad{color:var(--accent-ink)}
.acc-eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.acc-line{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:6px}
.ladder{display:flex;gap:2px;margin-top:11px;position:relative}
.ladder span{flex:1;height:6px;border-radius:2px;background:var(--line)}
.ladder span.s1{background:var(--verd)} .ladder span.s2{background:var(--verd);opacity:.6}
.ladder span.s3{background:var(--sulphur)} .ladder span.s4{background:var(--accent);opacity:.85}
.ladder .mk{position:absolute;top:-5px;width:3px;height:16px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--sunk)}
.ladder-key{display:flex;justify-content:space-between;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.acc-rows{margin:11px 0 0;padding:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
.acc-rows dt{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);padding-top:3px;white-space:nowrap}
.acc-rows dd{margin:0;color:var(--ink2);line-height:1.45}
.acc-flip{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);line-height:1.5}
.acc-flip b{color:var(--ink);font-weight:600}

/* thermal bar */
.thermal{padding:12px 16px 14px;border-top:1px solid var(--line-soft);background:var(--sunk)}
.thermal .tl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px}
.track{position:relative;height:7px;border-radius:4px;background:linear-gradient(90deg,#3F6E8C,#3F8C7A,#7FA23C,#C79A17,#C74E19);overflow:visible}
:root[data-theme="dark"] .track,:root:not([data-theme="light"]) .track{opacity:.85}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .track{opacity:1}}
.needle{position:absolute;top:-4px;width:3px;height:15px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--sunk)}
.thermal .cap{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.4}

/* barometer band */
.baro{padding:11px 16px 13px;border-top:1px solid var(--line-soft)}
.baro-top{display:flex;align-items:center;gap:7px;min-height:24px}
.baro-lab{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.baro-delta{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:auto}
.baro-body{display:flex;gap:13px;align-items:baseline;margin-top:5px}
.baro-read{flex:none;display:flex;align-items:baseline;gap:5px}
.baro-val{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.baro-unit{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink3)}
.baro-arrow{font-size:15px;line-height:1;font-weight:700;color:var(--ink3)}
.baro-arrow.good{color:var(--verd)} .baro-arrow.warn{color:var(--sulphur)} .baro-arrow.bad{color:var(--accent-ink)}
.baro-state{flex:none;font-size:14px;font-weight:600;line-height:1}
.baro-state.good{color:var(--verd)} .baro-state.warn{color:var(--sulphur)}
.baro-line{font-size:11.5px;color:var(--ink2);line-height:1.45;margin-top:7px}
.baro-trace{flex:none;width:60px;height:22px;opacity:.8;align-self:center}
.baro-trace polyline{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}

/* the gauge and the river's own character, inside the dashboard —
   this is what the old "how this reading was built" card carried */
.rd-meta{padding:12px 16px 14px;border-top:1px solid var(--line-soft)}
.rd-meta p{margin:0 0 7px;font-size:12px;color:var(--ink2);line-height:1.5}
.rd-meta p:last-child{margin-bottom:0}
.rd-meta b{color:var(--ink);font-weight:600}
.rd-meta .rd-note{color:var(--ink3);font-size:11.5px}
.rd-meta .hint{margin:9px 0 0}

/* fly shops on the Shop tab */
.shoprow{
  display:flex;gap:10px;align-items:flex-start;padding:10px 0;
  border-bottom:1px solid var(--line-soft);
}
.shoprow:last-child{border-bottom:0}
.shoprow .sn{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.shoprow .sn span{display:block;font-weight:400;font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.4}
.shoprow .wd{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink3);padding-top:2px}
.shoplinks{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.shoplinks a{
  font-size:11px;font-weight:600;text-decoration:none;color:var(--ink2);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--raised);
}
.shoplinks a:hover{border-color:var(--accent);color:var(--accent-ink)}

/* ---------- conditions, on the Report tab ---------- */
.panel .refine{margin-top:16px}
.refine-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
.refine-head h2{font-family:Fraunces,Georgia,serif;font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.refine-head .rh-src{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}

/* ---------- tabs ---------- */
.tabs{
  position:sticky;top:0;z-index:20;display:flex;gap:4px;margin:16px -16px 0;padding:8px 16px;
  background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.tab{
  flex:1;background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 4px;
  font-size:12.5px;font-weight:600;letter-spacing:.01em;color:var(--ink3);white-space:nowrap;
}
@media (max-width:430px){ .tab{font-size:11.5px;padding:7px 2px;letter-spacing:0} }
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow)}
.panel[hidden]{display:none}

/* ---------- play cards ---------- */
.plays{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.play{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.play.top{border-color:var(--accent);box-shadow:var(--shadow-lift)}
.p-head{display:flex;gap:12px;padding:14px 16px 12px;align-items:flex-start}
.rank{
  flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;
  background:var(--raised);color:var(--ink2);margin-top:2px;
}
.play.top .rank{background:var(--accent);color:#fff}
.p-title{min-width:0;flex:1}
.p-title h3{font-size:17.5px;font-weight:700;margin:0;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.p-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
  border-radius:5px;padding:2px 6px;background:var(--raised);color:var(--ink2);white-space:nowrap;
}
.chip.hot{background:var(--accent-soft);color:var(--accent-ink)}
.chip.grn{background:var(--verd-soft);color:var(--verd)}
.chip.sul{background:var(--sulphur-soft);color:var(--sulphur)}
.conf{flex:none;text-align:right;padding-top:2px}
.conf .n{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.conf .l{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.why{padding:0 16px 14px;font-size:13.5px;color:var(--ink2);line-height:1.55}
.why b{color:var(--ink);font-weight:600}

.sec{border-top:1px solid var(--line-soft);padding:12px 16px 14px}
.sec-lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:9px}

/* fly rows */
.flyrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-soft);align-items:flex-start}
.flyrow:last-child{border-bottom:0;padding-bottom:0}
.flyrow:first-of-type{padding-top:0}
.swatch{flex:none;width:16px;height:16px;border-radius:5px;margin-top:2px;border:1px solid var(--ring);box-shadow:inset 0 -3px 6px rgba(0,0,0,.12)}
.flymain{flex:1;min-width:0}
.flyname{font-size:14px;font-weight:600;line-height:1.3}
.flyspec{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.flynote{font-size:11.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.qty{
  flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ink2);
  background:var(--raised);border-radius:5px;padding:2px 6px;margin-top:1px;
}

/* spec table */
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.specs dt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding-top:3px;white-space:nowrap}
.specs dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.5;color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:9px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.steps li::before{
  content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:8px;opacity:.75;
}
.steps b{color:var(--ink);font-weight:600}

/* ---------- shop list ---------- */
.shop-intro{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  margin-top:16px;box-shadow:var(--shadow);
}
.shop-intro h2{font-family:Fraunces,Georgia,serif;font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.shop-intro p{margin:0;font-size:13px;color:var(--ink2);line-height:1.5}
.shopcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.shopcard h3{
  margin:0;padding:11px 16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  background:var(--raised);border-bottom:1px solid var(--line);font-weight:600;
}
.slist{margin:0;padding:4px 16px 12px;list-style:none}
.sitem{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.sitem:last-child{border-bottom:0}
.box{
  flex:none;width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;margin-top:2px;background:var(--ground);
}
.sitem.on .box{background:var(--verd);border-color:var(--verd);position:relative}
.sitem.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.sitem.on .sname{text-decoration:line-through;color:var(--ink3)}
.sbody{flex:1;min-width:0}
.sname{font-size:15px;font-weight:600;line-height:1.3}
.sspec{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.45}
.sfor{font-size:11px;color:var(--ink3);margin-top:2px}

/* ---------- hatch timeline ---------- */
.hbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;padding:13px 16px;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:11px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.hrow:last-child{border-bottom:0}
.hname{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.25}
.hlat{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink3);font-style:italic;font-weight:400}
.hspec{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);white-space:nowrap;flex:none}
.hmeter{flex:none;width:64px;height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.hmeter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.hmeter.dim i{background:var(--line)}

/* ---------- water tab ---------- */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;padding:14px 16px;box-shadow:var(--shadow)}
.wcard h3{margin:0 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.wcard p{margin:0 0 10px;font-size:13.5px;color:var(--ink2);line-height:1.55}

/* --- barometer ----------------------------------------------
   Trend, not absolute height, is what moves fish. Weights below
   are differential nudges applied to play scores in recommend().
------------------------------------------------------------ */
const BARO_STATES = {
  falling:{k:"falling", label:"Falling", arrow:"\u2193", tone:"good",
    line:"Dropping ahead of a front \u2014 the best window there is. Fish feed hard and ride higher in the column.",
    w:{surf:1.08, deep:0.97, swing:1.05}},
  steady:{k:"steady", label:"Steady", arrow:"\u2192", tone:"",
    line:"Flat pressure. Nothing pushing the fish either way \u2014 read the hatch and the water, not the sky.",
    w:{surf:1, deep:1, swing:1}},
  rising:{k:"rising", label:"Rising", arrow:"\u2191", tone:"warn",
    line:"Climbing behind a front \u2014 the classic bluebird slog. Fish sit deep and eat small. Go down, and downsize.",
    w:{surf:0.92, deep:1.08, swing:0.97}},
};
const HPA_IN = 0.02953;               // hPa \u2192 inches of mercury
const BARO_STEP = 0.7;                // hPa over 3 h that counts as a real move

/* --- planning a day ahead -----------------------------------
   A gauge reading is not a forecast. The gap between the gauge
   and the model for today is closer to one: a river running warm
   or high this afternoon is still likely to be running warm or
   high tomorrow. So that anomaly is carried forward and allowed
   to decay — quickly for flow, which a single storm resets, and
   slowly for water temperature, which has a season's mass behind
   it. A week out there is nothing of the gauge left in the number
   and the reading is the seasonal curve plus whatever the diary
   knows about that week on that water. Pressure is not carried at
   all: nobody reads a barometer three days early.
------------------------------------------------------------ */
const LEAD_MAX  = 21;      // days ahead the planner will read
const TAU_FLOW  = 3.5;     // e-folding of a flow anomaly, in days
const TAU_TEMP  = 5.5;     // ...and of a water-temperature one
const CARRY_MIN = 0.15;    // below this the gauge is not worth claiming
const carryOf = (lead,tau)=> lead<=0 ? 1 : Math.exp(-lead/tau);

function plannedWhen(){
  if(!state.plan) return new Date();
  const [y,m,d]=state.plan.date.split("-").map(Number);
  const h=Math.floor(state.plan.hour), mi=Math.round((state.plan.hour-h)*60);
  return new Date(y, m-1, d, h, mi);
}
/* Whole days between today and the day being read. */
function leadDays(when){
  const a=new Date(); a.setHours(0,0,0,0);
  const b=new Date(when.getFullYear(), when.getMonth(), when.getDate());
  return Math.max(0, Math.round((b-a)/86400000));
}

function water(){ return state.spot || WATERS.find(w=>w.id===state.waterId) || WATERS[0]; }

/* A synthesized spot borrows its hatch calendar from the water
   it was modeled on, so water-specific bugs still resolve. */
const hatchKeyOf=(w)=>w.hatchKey||w.id;
function doy(d){ return Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000); }
function hoursOf(d){ return d.getHours() + d.getMinutes()/60; }
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* NOAA solar position — sunrise / sunset for a date and place */
function solar(date, lat, lon){
  const rad=Math.PI/180;
  const start=new Date(date.getFullYear(),0,1);
  const n=Math.floor((date-start)/86400000);
  const gamma=2*Math.PI/365*(n + (date.getHours()-12)/24);
  const eqtime=229.18*(0.000075+0.001868*Math.cos(gamma)-0.032077*Math.sin(gamma)
      -0.014615*Math.cos(2*gamma)-0.040849*Math.sin(2*gamma));
  const decl=0.006918-0.399912*Math.cos(gamma)+0.070257*Math.sin(gamma)
      -0.006758*Math.cos(2*gamma)+0.000907*Math.sin(2*gamma)
      -0.002697*Math.cos(3*gamma)+0.00148*Math.sin(3*gamma);
  const cosH=(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(decl)))-Math.tan(lat*rad)*Math.tan(decl);
  const tzOffsetMin=-date.getTimezoneOffset();
  if(cosH>1||cosH<-1){ return {sunrise:6,sunset:18,noon:12,polar:true}; }
  const ha=Math.acos(clamp(cosH,-1,1))/rad;
  const noonUTCmin=720-4*lon-eqtime;
  const toLocal=(m)=>(((m+tzOffsetMin)/60)%24+24)%24;
  let sr=toLocal(noonUTCmin-4*ha), ss=toLocal(noonUTCmin+4*ha), nn=toLocal(noonUTCmin);
  if(ss<sr) ss+=24;                       // sunset past local midnight
  if(nn<sr) nn+=24;
  return { sunrise:sr, sunset:ss, noon:nn, polar:false };
}

/* Modeled water temperature: monthly mean + diurnal sine peaking at 15:00 */
function modelTemp(w, date){
  const m=date.getMonth(), h=hoursOf(date);
  const next=w.temps[(m+1)%12], cur=w.temps[m];
  const frac=(date.getDate()-1)/30;
  const base=lerp(cur,next,clamp(frac,0,1));
  const diurnal=(w.swing/2)*Math.cos(2*Math.PI*(h-15)/24);
  return Math.round((base+diurnal)*10)/10;
}

/* Modeled flow index (× the ideal mid-band) */
function modelFlow(w, date){
  const m=date.getMonth(), cur=w.flowIx[m];
  if(w.stepped) return cur;                       // regulated release — a step, not a curve
  const next=w.flowIx[(m+1)%12];
  const frac=(date.getDate()-1)/30;
  return lerp(cur,next,clamp(frac,0,1));
}

const FLOW_STATES=[
  {k:"verylow",  label:"Very low",   ratio:.45, blurb:"deepest pools, riffle heads, undercuts"},
  {k:"low",      label:"Low",        ratio:.72, blurb:"deeper runs and shade; stealth matters"},
  {k:"normal",   label:"Normal",     ratio:1.0, blurb:"classic lies — heads, seams, tailouts"},
  {k:"pushy",    label:"High-normal",ratio:1.45,blurb:"inside seams, soft edges, shoreline buckets"},
  {k:"high",     label:"High",       ratio:2.2, blurb:"tight to the banks and behind structure"},
  {k:"blown",    label:"Blown",      ratio:3.4, blurb:"edges only — or move to a smaller drainage"},
];
function flowStateFromIndex(ix){
  if(ix<0.58) return FLOW_STATES[0];
  if(ix<0.86) return FLOW_STATES[1];
  if(ix<1.22) return FLOW_STATES[2];
  if(ix<1.75) return FLOW_STATES[3];
  if(ix<2.7)  return FLOW_STATES[4];
  return FLOW_STATES[5];
}
function flowStateFromCfs(w,cfs){
  const mid=(w.flow.ideal[0]+w.flow.ideal[1])/2;
  return flowStateFromIndex(cfs/mid);
}

const CLARITY={
  gin:{k:"gin",label:"Gin clear",vis:"36 in +",n:4},
  clear:{k:"clear",label:"Clear",vis:"24–36 in",n:3},
  green:{k:"green",label:"Steelhead green",vis:"~16 in",n:2},
  stained:{k:"stained",label:"Stained",vis:"12–24 in",n:1},
  muddy:{k:"muddy",label:"Muddy",vis:"under 12 in",n:0},
};
function modelClarity(fs, w){
  if(fs.k==="blown") return CLARITY.muddy;
  if(fs.k==="high") return CLARITY.stained;
  if(fs.k==="pushy") return CLARITY.green;
  if(fs.k==="verylow") return CLARITY.gin;
  return w.type==="freestone"?CLARITY.clear:CLARITY.clear;
}

function lightWindow(h0, sun){
  const {sunrise:sr, sunset:ss}=sun;
  let h=h0;
  if(ss>24 && h < sr-0.75) h+=24;         // clock wrapped past midnight
  if(h < sr-0.75 || h > ss+0.9) return {k:"night", label:"Night", n:0};
  if(h < sr+0.25) return {k:"dawn", label:"First light", n:1};
  if(h < sr+2) return {k:"early", label:"Early morning", n:2};
  if(h < 11) return {k:"morning", label:"Morning", n:3};
  if(h < 15) return {k:"midday", label:"Midday", n:4};
  if(h < ss-1.75) return {k:"afternoon", label:"Afternoon", n:5};
  if(h < ss-0.4) return {k:"evening", label:"Evening", n:6};
  return {k:"dusk", label:"Last light", n:7};
}

/* --- wade or float ---------------------------------------- */
const FLOAT_TXT={
  drift:"This is genuine drift-boat water.",
  limited:"Floatable in stretches, but it is mainly a wading river.",
  none:"No float fishery here — it is too small to run a boat."
};
function access(ctx){
  const w=ctx.w, q=ctx.cfs, wd=w.wade, canFloat=w.float!=="none";
  let call, tone, line, crossings, gear, boat;
  const bump=(msg)=>msg;

  if(q < wd.full*0.42){
    call="Wade"; tone="good";
    line=`At ${q} ${w.unit.split(" ")[0]} this is low water. Everything is open to you and nothing is pushy.`;
    crossings="Cross wherever you like. The problem today is being seen, not being swept.";
    gear="Wading staff optional. Move slowly, keep low, and stay off the skyline.";
    boat = canFloat ? "Leave the boat. At this level you would spend the day dragging it over gravel."
                    : FLOAT_TXT[w.float];
  } else if(q <= wd.full){
    call="Wade"; tone="good";
    line=`At ${q} ${w.unit.split(" ")[0]} the whole river is wadable.`;
    crossings="Crossings are open almost anywhere. Read the tailouts and cross at the wide, shallow fans.";
    gear="Studded boots. A staff if the bottom here is bowling-ball cobble.";
    boat = canFloat ? "The boat is not necessary. Take it only if you want to cover miles rather than fish water."
                    : FLOAT_TXT[w.float];
  } else if(q <= wd.good){
    call="Wade"; tone="good";
    line=`At ${q} ${w.unit.split(" ")[0]} most of the river is still wadable — call it two thirds of it.`;
    crossings="Pick your crossings deliberately and cross at the tailouts, not the runs. Do not commit to a crossing you cannot reverse.";
    gear="Studded boots and a wading staff. Belt cinched.";
    boat = canFloat ? "This is also a good float level — the boat buys you water you cannot reach on foot, but you do not need it."
                    : FLOAT_TXT[w.float];
  } else if(q <= wd.limited){
    call = canFloat ? "Bring the boat" : "Wade the edges";
    tone="warn";
    line=`At ${q} ${w.unit.split(" ")[0]} the river is pushy. Wading is confined to the banks and the inside of bends.`;
    crossings="Assume you cannot cross. Plan the day as one bank, and walk back the way you came.";
    gear="Studded boots, staff, tight belt. Fish within your own reach and do not lean on the current.";
    boat = canFloat ? "Trailer it. This is the level where the boat stops being a luxury and starts being the only way to fish the good water."
                    : "No boat option here — fish the soft edges, or move to a bigger river that fishes at high flow.";
  } else if(q <= wd.max){
    call = canFloat ? "Boat only" : "Marginal — edges only";
    tone="bad";
    line=`At ${q} ${w.unit.split(" ")[0]} this is at the top of what is safe on foot.`;
    crossings="No crossings. Stay in water you can stand up in without bracing.";
    gear="Staff, belt, and an honest look at the bank before you step in. Fish alone at this level and you are the rescue plan.";
    boat = canFloat ? "Take the boat and a rower who knows the run. Wade-fish only from the anchor, in the shallows you row to."
                    : "Fish the flooded margins and the slack behind structure, or go somewhere smaller.";
  } else {
    call = canFloat ? "Blown — boat or bail" : "Blown";
    tone="bad";
    line=`At ${q} ${w.unit.split(" ")[0]} this water is over its blowout number.`;
    crossings="Do not wade.";
    gear="—";
    boat = canFloat ? "Only with an experienced oarsman, and only if the level is falling. Otherwise pick a smaller, faster-clearing drainage."
                    : "Find a smaller drainage or a dam-buffered river that holds shape.";
  }

  // where the call flips
  const rungs=[["Full river wadable",wd.full],["Most of it wadable",wd.good],
               [canFloat?"Boat is the better tool":"Edges only",wd.limited],
               [canFloat?"Boat only":"Top of safe wading",wd.max]];
  let flip=null;
  for(const [lab,v] of rungs){ if(q<=v){ flip={lab,v,dir:"up",gap:v-q}; break; } }
  if(!flip) flip={lab:"Over the blowout number",v:wd.max,dir:"over",gap:q-wd.max};

  return {call, tone, line, crossings, gear, boat, wd, canFloat,
          pos: clamp(q/(wd.max*1.18),0,1), flip, q};
}

function buildContext(){
  const w=water(), d=state.when;
  const sun=solar(d,w.lat,w.lon);
  const h=hoursOf(d);
  const day=doy(d);
  const live=state.live && state.live.gauge===w.gauge ? state.live : null;

  const now=new Date(), lead=leadDays(d);
  const kT=carryOf(lead,TAU_TEMP), kF=carryOf(lead,TAU_FLOW);

  /* Temperature anomalies are additive — a river three degrees warm
     than its curve stays about three degrees warm. */
  let temp, tempSource;
  if(live && live.tempF!=null && kT>=CARRY_MIN){
    temp = Math.round((modelTemp(w,d) + (live.tempF - modelTemp(w,now))*kT)*10)/10;
    tempSource = lead===0 ? "live" : "carried";
  } else { temp = modelTemp(w,d); tempSource = "model"; }

  /* Flow anomalies are multiplicative — twice the seasonal number
     is twice the seasonal number whatever month it is. */
  const mid=(w.flow.ideal[0]+w.flow.ideal[1])/2;
  let flowIx, cfs=null, flowSource="model";
  if(live && live.cfs!=null && kF>=CARRY_MIN){
    const modelNow=modelFlow(w,now);
    const ratio = modelNow>0.01 ? clamp((live.cfs/mid)/modelNow, 0.1, 10) : 1;
    flowIx = modelFlow(w,d)*Math.pow(ratio,kF);
    flowSource = lead===0 ? "live" : "carried";
  } else { flowIx=modelFlow(w,d); }
  cfs = Math.round(mid*flowIx);

  let fs = flowStateFromIndex(flowIx);
  if(state.ov.flow){ fs=FLOW_STATES.find(f=>f.k===state.ov.flow); flowSource="you"; cfs=Math.round(mid*fs.ratio); }

  let clarity = state.ov.clarity ? CLARITY[state.ov.clarity] : modelClarity(fs,w);
  const sky = state.ov.sky || "partly";
  const lw = lightWindow(h,sun);
  const baro = resolveBaro(w, lead);

  const base={w, d, day, h, sun, temp, tempSource, cfs, flowIx, fs, flowSource, clarity, sky, lw, live, baro,
          lead, carry:{temp:kT, flow:kF}, isGL: w.sp==="steelhead",
          outOfBook: !!w.beyond, templateMiles: w.templateMiles||0, range: w.range||"near"};
  base.mem=recall(base);      // the angler's own days on this water, near this date
  base.acc=access(base);
  return base;
}

/* Pressure is never modeled from the calendar \u2014 it isn't seasonal.
   Live reading first, then the angler's tap, then an honest blank. */
function resolveBaro(w, lead){
  const b = state.baro;
  // today's glass says nothing about Saturday's, so a planned day gets none of it
  const fresh = !lead && b && Math.abs(b.lat-w.lat)<0.5 && Math.abs(b.lon-w.lon)<0.5;

  if(state.ov.baro){
    const st=BARO_STATES[state.ov.baro];
    return Object.assign({}, st, {source:"you", hPa: fresh?b.hPa:null, hist: fresh?b.hist:null,
      delta: fresh?b.delta3h:null, srcLabel:"Your read", chipLabel:"your read"});
  }
  if(fresh){
    const d=b.delta3h;
    const st = d<=-BARO_STEP ? BARO_STATES.falling : d>=BARO_STEP ? BARO_STATES.rising : BARO_STATES.steady;
    const high = b.hPa>=1025, low = b.hPa<=1005;
    let line=st.line;
    if(st.k==="steady" && high) line="Flat and high \u2014 settled, bright, and usually stingy. Fish early, late, and small.";
    if(st.k==="steady" && low)  line="Flat but low \u2014 unsettled air sitting over the river. Fish are usually willing.";
    return Object.assign({}, st, {source:"live", hPa:b.hPa, hist:b.hist, delta:d, srcLabel:"Live", chipLabel:"live"});
  }
  if(lead) return Object.assign({}, BARO_STATES.steady, {source:"ahead", hPa:null, hist:null, delta:null,
    srcLabel:"Not yet", chipLabel:"too far out to read",
    line:`Pressure is the one thing that cannot be carried ${lead===1?"even a day":`${lead} days`} forward — it is weather, not season. Riffle assumes flat until the day gets close, which nudges nothing. Check a forecast the night before, then tap it on <b>Report</b>.`});
  return Object.assign({}, BARO_STATES.steady, {source:"assumed", hPa:null, hist:null, delta:null,
    srcLabel:"Assumed", chipLabel:"not measured here", line:"No pressure reading here. Riffle assumes flat, which nudges nothing. If the glass is moving, tap it below and the plays re-rank."});
}

/* --- which hatches are on ---------------------------------- */
function shiftOf(hx, ctx){ return hx.waters==="all" ? ctx.w.shift : 0; }
function hatchIntensity(hx, ctx){
  const sh=shiftOf(hx,ctx);
  const s=hx.win[0]+sh, p=hx.win[1]+sh, e=hx.win[2]+sh;
  let day=ctx.day;
  const mem = ctx.mem ? ctx.mem.hatch[hx.id] : null;   // have you seen this one here, this week?
  let base;
  if(day<s||day>e){
    /* Off the printed calendar. A sighting logged near this date on
       this water buys a few days at the edge — hatches run early or
       late by a week and the book knows which way this one runs —
       but never a hatch clean out of its season. */
    const off=Math.min(Math.abs(day-s), Math.abs(day-e));
    if(!mem || off>MEM_STRETCH) return 0;
    base = 0.42*mem.seen*(1-off/MEM_STRETCH);
  } else {
  base = day<=p ? (day-s)/Math.max(1,(p-s)) : 1-(day-p)/Math.max(1,(e-p));
  base = clamp(base,0,1);
  base = 0.25 + 0.75*base;                    // shoulders still count
  if(hx.bimodal){                              // Isonychia: two peaks in one envelope
    const near=Math.min(...hx.bimodal.map(pk=>Math.abs(day-(pk+sh))));
    base = clamp(1 - near/32, .15, 1);
  }
  if(mem) base = clamp(base*mem.mult, 0, 1.35);
  }
  // water temperature gate
  const [tl,th]=hx.temp;
  if(ctx.temp<tl-6||ctx.temp>th+8) base*=0.25;
  else if(ctx.temp<tl||ctx.temp>th) base*=0.65;
  return base;
}
function inClock(hx, ctx){
  const sr=ctx.sun.sunrise, ss=ctx.sun.sunset;
  let h=ctx.h; if(ss>24 && h<sr-0.75) h+=24;
  if(hx.hrs==="allday") return 1;
  if(hx.hrs==="dusk")  return h>=ss-1.5 && h<=ss+0.9 ? 1 : (h>ss-3.5?0.35:0.1);
  if(hx.hrs==="dawn")  return h<=sr+2 ? 1 : 0.15;
  const [a,b]=hx.hrs;
  if(h>=a && h<=b) return 1;
  const gap=Math.min(Math.abs(h-a),Math.abs(h-b));
  return gap<1.5 ? 0.55 : 0.15;
}
function rankOf(o){
  const local = o.hx.waters!=="all" ? (o.hx.marquee?1.5:1.1) : 1;  // a water's signature hatch outranks background bugs
  const marq  = o.hx.marquee ? 1.15 : 1;
  return o.i * o.clock * local * marq;
}
function activeHatches(ctx){
  if(ctx.outOfBook) return [];        // no calendar reaches this water
  return HATCHES
    .filter(hx => hx.waters==="all" ? ctx.w.sp==="trout" : hx.waters.includes(hatchKeyOf(ctx.w)))
    .map(hx=>({hx, i:hatchIntensity(hx,ctx), clock:inClock(hx,ctx)}))
    .filter(o=>o.i>0.02)
    .map(o=>(o.rank=rankOf(o), o))
    .sort((a,b)=> b.rank - a.rank);
}
function activeRuns(ctx){
  if(!ctx.isGL) return [];
  return RUNS.filter(r => r.waters==="gl" || r.waters.includes(hatchKeyOf(ctx.w)))
    .map(r=>{
      const [s,p,e]=r.win;
      let d=ctx.day, i=0;
      if(d>=s&&d<=e) i = d<=p ? (d-s)/Math.max(1,p-s) : 1-(d-p)/Math.max(1,e-p);
      if(s>e){ i = (d>=s||d<=e)?0.8:0; }
      return {r, i:clamp(0.3+0.7*clamp(i,0,1), 0, 1) * (d>=s&&d<=e?1:0)};
    })
    .filter(o=>o.i>0.05).sort((a,b)=>b.i-a.i);
}

/* ============================================================
   3. PLAY LIBRARY + SCORING
   ============================================================ */

const sizeStr=(r)=> Array.isArray(r) ? (r[0]===r[1]?`#${r[0]}`:`#${r[0]}–${r[1]}`) : `#${r}`;
function pickX(size){ // tippet X for a hook size
  if(size>=22) return "7X"; if(size>=20) return "6X"; if(size>=16) return "5X";
  if(size>=12) return "4X"; if(size>=8) return "3X"; return "2X";
}
function beadFor(size){
  if(size>=20) return "2.0 mm"; if(size>=16) return "2.5 mm";
  if(size>=13) return "3.0 mm"; if(size>=10) return "3.5 mm"; return "4.0 mm";
}

function flies(list, colorHex, qty, note){
  return list.map(([name,rng])=>({name, size:sizeStr(rng), hex:colorHex, qty:qty||"2–3", note:note||""}));
}

    why:`${caddis?"Ovipositing caddis dive and swim, and a swung soft hackle imitates that better than any dead drift can. ":"Emerging duns rise through the column, and a swung wet crosses that path. "}It also lets you fish a rise you cannot see — the take is a pull, not a guess.`,

    steps:[
      "<b>Cast down and across at about 45 degrees</b> and lead the swing with the rod tip so the flies come around under tension.",

      "<b>Let it hang.</b> Count to five on the dangle before you pick up — a startling share of the eats happen straight below you.",

    flyGroups:[
      {lab:"Soft hackles", items:[

        {name:"Starling & Herl", size:"#16–18", hex:"#3D4B3A", qty:"2", note:"for the small stuff"}]},
      {lab:"The point fly", items: flies((src.hx.nymph||[]).slice(0,1),src.hx.hex,"2","a touch of weight to get the team down")},

      "Leader":"9 ft tapered to 4X",

{key:"mouse", build(ctx, ah){
  if(ctx.isGL) return null;

  if(ctx.lw.k!=="night"&&ctx.lw.k!=="dusk") return null;
  if(ctx.w.size<2) return null;                 // a mouse needs room to swim
  let s = 12;
  if(ctx.lw.k==="night") s+=14;
  if(ctx.temp>=58&&ctx.temp<=70) s+=10;         // the fish are awake and eating
  if(ctx.temp>70) s-=10;                        // too warm to be handling them at all
  if(ctx.temp<54) s-=12;
  if(ctx.day>=DOY(6,20)&&ctx.day<=DOY(9,10)) s+=8;
  if(ctx.w.type==="freestone") s+=5;
  if(ctx.fs.k==="normal"||ctx.fs.k==="pushy") s+=6;
  if(ctx.fs.k==="verylow") s-=6;
  if(ctx.fs.k==="blown") s-=14;
  if(ctx.clarity.n<=1) s-=6;
  if(ctx.sky==="overcast") s+=4;                // no moon is better than a moon
  const warm = ctx.temp>68;
  return {
    score:s,
    title: ctx.lw.k==="night" ? "Swim a mouse in the dark" : "Mouse the last of the light out",
    technique:"Mouse — night, swung and swum on top",
    chips:[["After dark","grn"],["Big fish, few fish",""],[warm?"Handle carefully":"Bank water",""]],
    why:`The largest brown in this river almost never eats in daylight in ${ctx.day<DOY(8,1)?"midsummer":"late summer"} — it eats at night, and it eats things that are swimming, not drifting. A mouse gives a fish that has seen ten thousand drifted flies something it has never been fooled by. Expect very few takes and an outsized average fish.${warm?" At this temperature, fight them fast and keep them wet — a night-caught fish in warm water is easy to kill by accident." : ""}`,
    where:"Wade water you walked in daylight. Cast tight to the far bank, undercuts and log jams, and swim it back across the soft inside of every seam. The tailout of a big pool at 2am is the classic spot.",
    steps:[
      "<b>Walk it in the light first.</b> Pick one pool, learn its wading, then come back after dark. Do not explore at night.",
      "<b>Cast to the bank and swim, don't drift.</b> Quarter down, keep the line tight, and lead the fly so it pushes a small wake the whole way across.",
      "<b>Wait for weight.</b> You will hear the take before you feel it. Do not set on the sound — set when the rod loads, and set sideways.",
      "<b>Cover it once, then move.</b> A fish that boils and misses will often come again in ten minutes; a pool you have swum twice is done for the night."
    ],
    flyGroups:[
      {lab:"Mice & big waking flies", items:[
        {name:"Deer-hair Mouse (Morrish or Master Splinter)", size:"#2–4", hex:"#6B5844", qty:"2", note:"the one that has to float all night"},
        {name:"Foam Gurgler, black", size:"#2–6", hex:"#1E1B18", qty:"2", note:"easier to cast, wakes just as well"},
        {name:"Muddler Minnow, oversized", size:"#2–6", hex:"#A9865A", qty:"2", note:"fish it dry on top or wet just under"}]},
      {lab:"When they will not eat on top", items:[
        {name:"Black Woolly Bugger", size:"#2–6", hex:"#1A1A1A", qty:"3", note:"a black silhouette is the whole point after dark"},
        {name:"Zoo Cougar / Sculpin, tan", size:"#2–4", hex:"#B08F5E", qty:"2", note:""}]},
    ],
    rig:{
      "Rod / line":"9 ft 6–7 wt, weight-forward floating — you are casting a wet golf ball",
      "Leader":"6–7 ft: 3 ft of 30 lb, 2 ft of 20 lb, 2 ft of 12–16 lb",
      "Tippet":"0X–1X (12–16 lb). Fine tippet at night only loses fish you will think about for years.",
      "Weight":"None. Dress it and squeeze it dry often.",
      "Connection":"Non-slip loop knot so it swims with its nose up",
      "Bring":"A headlamp with a red mode, and a wading staff. Rig up before dark."
    },
    tackle:[T.fluoro("0X"), T.fluoro("1X"), T.floatant()],
    windowTxt: ctx.lw.k==="night" ? "Full dark to about 2:00" : "Last light into full dark"
  };
}},

{key:"highwater", build(ctx, ah){
  if(ctx.isGL) return null;

  if(ctx.fs.k==="high") s+=12;
  if(ctx.fs.k==="blown") s+=8;                  // still fishable, but only the edges

  if(ctx.clarity.n<=1) s+=8;                    // dirty water is exactly when this wins
  if(ctx.clarity.n>=3) s-=6;
  if(ctx.temp>=45&&ctx.temp<=65) s+=6;
  if(ctx.temp<42) s-=8;
  if(ctx.w.size>=3) s+=4;
  if(ctx.acc&&ctx.acc.tone==="bad") s-=6;       // when it is not safe to be in it, lean on it less
  const filthy = ctx.clarity.n<=1;
  return {
    score:s,
    title: ctx.fs.k==="blown" ? "Fish the edges of a blown river" : "Work the high-water edge",
    technique:"High water — heavy fly, short line, hard against the bank",
    chips:[[ctx.fs.label,"warn"],[ctx.clarity.label,""],["Edges only",""]],
    why:`At ${ctx.cfs.toLocaleString()} ${ctx.w.unit} the fish are not where you normally find them. They have left the main current entirely and are sitting in water you could stand in — inside bends, flooded grass, the slack behind a boulder, the seam six inches off the bank. ${filthy?"They cannot see far, so they are hunting by silhouette and vibration: go big, go dark, and go close.":"The river is pushing but readable — the fish have simply slid sideways."} High water is not a lost day, it is a different map.`,
    where:"The first three feet from the bank, the slack inside every bend, flooded willow and grass margins, and the cushion in front of and behind any boulder large enough to break the surface. Walk the bank, do not wade the middle.",
    steps:[
      "<b>Fish where you would normally walk.</b> The lie you are looking for is ankle to knee deep, out of the push, and often behind you.",
      "<b>Short casts, tight line.</b> Ten to twenty feet. You cannot mend your way to a drift in this — get close and lead the fly.",
      `<b>${filthy?"Go dark and go big.":"Go big before you go heavy."}</b> ${filthy?"Black and olive show as a silhouette in stained water where naturals disappear. Size is how the fish finds it.":"A #8 stonefly gets seen where a #16 pheasant tail vanishes."} Weight is what keeps it in the strike zone in fast water.`,
      "<b>Check the bank before every step.</b> Rising water undercuts and moves gravel. If you would not wade it sober in daylight, do not wade it at all."
    ],
    flyGroups:[
      {lab:"Big nymphs", items:[
        {name:"Pat's Rubber Legs, black/brown", size:"#6–10", hex:"#3A2E22", qty:"3", note:"the high-water fly in the Northeast, and it is not close"},
        {name:"Tungsten Stonefly, golden", size:"#8–12", hex:"#B98A3C", qty:"3", note:""},
        {name:"Squirmy Worm / San Juan Worm, pink or red", size:"#10–12", hex:"#D2596B", qty:"4", note:"washed in from the banks — this is the real thing right now"},
        {name:"Egg pattern, peach or chartreuse", size:"#12–14", hex:"#F2A65A", qty:"3", note:"a visible round target in bad water"}]},
      {lab:"Streamers for the same water", items:[
        {name:"Black or olive Woolly Bugger, coneheaded", size:"#4–8", hex:"#22301F", qty:"3", note:""},
        {name:"Sculpin pattern, dark", size:"#4–6", hex:"#5A4A38", qty:"2", note:"swim it slowly along the bank you are standing on"}]},
    ],
    rig:{
      "Rod / line":"9 ft – 10 ft 6 wt, weight-forward floating. The extra length is reach, not distance.",
      "Leader":"7½–9 ft tapered to 2X–3X — short and stout, it must turn over the weight",
      "Tippet":"2X–3X fluorocarbon. Fine tippet in high water just donates flies to the river.",
      "Weight":"Enough to tick bottom in the first two feet of the drift. Add shot until you touch, then take one off.",
      "Indicator":"Large and buoyant, or a tight-line sighter if you are within a rod length",
      "Bring":"A wading staff and a belt, cinched. This is the water that drowns people."
    },
    tackle:[T.leader("9 ft","3X","nylon"), T.fluoro("2X"), T.fluoro("3X"), T.shot("#4, BB, 3/0"), T.bobber("¾ in")],
    windowTxt:"All day — the water, not the clock, is what changes"
  };
}},

{key:"crustacean", build(ctx, ah){
  if(ctx.isGL) return null;
  const scud = ah.filter(o=>o.hx.kind==="crustacean")[0];
  const limestone = ctx.w.type==="limestone", tail = ctx.w.type==="tailwater";
  if(!scud && !tail) return null;               // freestones do not hold enough of them to plan on
  let s = 11;
  if(scud) s+=10;
  if(limestone) s+=10;
  if(tail) s+=6;
  if(ctx.w.size<=2) s+=3;
  if(ctx.fs.k==="verylow"||ctx.fs.k==="low"||ctx.fs.k==="normal") s+=5;
  if(ctx.fs.k==="high"||ctx.fs.k==="blown") s-=10;
  if(ctx.clarity.n>=3) s+=4;
  /* Its whole reason for existing is the day with no hatch on it. */
  const best = ah.filter(o=>o.hx.kind!=="crustacean")[0];
  if(!best || best.i<0.35) s+=12;
  else if(best.i>0.7) s-=8;
  if(ctx.temp>=38&&ctx.temp<=60) s+=5;
  if(ctx.day<DOY(4,15)||ctx.day>DOY(10,15)) s+=6;   // the cold months are scud months
  return {
    score:s,
    title: limestone ? "Scuds and cress bugs on the limestone" : "Scuds through the tailwater",
    technique:"Nymph — crustacean, dead drift near the bottom",
    chips:[["Scud · sowbug · cress bug","sul"],["No hatch needed",""],[limestone?"Weed beds":"Below the dam",""]],
    why:`${limestone?"A limestoner carries scuds and cress bugs in the weed all year, in numbers no mayfly ever reaches. Its trout eat them every day of their lives — which is why a good cress bug outfishes a good hatch imitation on eleven months out of twelve.":"Tailwater fish below a bottom-release dam live on scuds. The steady cold water grows them year-round, and there is no season when the fish stop expecting them."} This is the play for the day when nothing is coming off and everything still needs to eat.`,
    where:"The downstream edge of every weed bed, the gravel between the weed, the first slot below a riffle, and any channel a foot deeper than the water beside it. On the limestone, fish the seam where the weed ends and the sand begins.",
    steps:[
      "<b>Get it on the bottom and keep it there.</b> A scud that drifts a foot off the gravel is a scud no fish has ever seen.",
      "<b>Match the size before the colour.</b> #14–16 covers most of it. Grey-olive when the water is clear, tan when it is stained.",
      "<b>Fish it short.</b> Fifteen to twenty-five feet, leader mostly out of the water, watching the sighter or the leader butt for the hesitation.",
      "<b>Add an orange one.</b> A scud that has been eaten or is carrying eggs goes orange, and a single hot-spot scud in the team gets a disproportionate share of the takes."
    ],
    flyGroups:[
      {lab:"Scuds & sowbugs", items:[
        {name:"Grey-Olive Scud, tungsten bead", size:"#14–16", hex:"#8C8A6E", qty:"4", note:"the anchor"},
        {name:"Sowbug / Cress Bug, grey", size:"#14–18", hex:"#9A9A8C", qty:"4", note:"flat, drab, and deadly on the Letort and Spring Creek"},
        {name:"Tan Scud", size:"#14–16", hex:"#C2A87A", qty:"3", note:"stained water"},
        {name:"Hot-Orange Scud", size:"#14–16", hex:"#E07B2C", qty:"2", note:"the one that gets eaten out of turn"}]},
      {lab:"The natural dropper", items:[
        {name:"Pheasant Tail, small", size:"#16–20", hex:"#6E4B2A", qty:"3", note:"18 in below the scud, for the fish that wanted something else"},
        {name:"Zebra Midge, black-silver", size:"#18–20", hex:"#2A2A2A", qty:"3", note:"winter droppers"}]},
    ],
    rig:{
      "Rod / line":"9 ft – 10 ft 3–4 wt, weight-forward floating",
      "Leader":limestone?"12 ft tapered to 5X — these fish are looked at every weekend":"9–10 ft tapered to 4X",
      "Tippet":limestone?"3 ft of 5X–6X fluorocarbon":"2–3 ft of 4X–5X fluorocarbon",
      "Weight":"A 2.5 mm tungsten bead on the scud is usually enough. One #8 shot if the slot is deep.",
      "Indicator":"Wool, a greased leader butt, or nothing at all if you are close enough to watch the leader",
      "Connection":"Tippet ring above the point fly; hang the dropper off a tag"
    },
    tackle:[T.leader(limestone?"12 ft":"9 ft",limestone?"5X":"4X","nylon"), T.fluoro("5X"), T.fluoro("6X"), T.rings(), T.shot("#8, #6")],
    windowTxt:"All day, best when nothing is hatching"
  };
}},

{key:"sight", build(ctx, ah){
  if(ctx.isGL) return null;
  if(ctx.fs.k!=="verylow"&&ctx.fs.k!=="low") return null;
  if(ctx.clarity.n<3) return null;              // you cannot sight-fish water you cannot see into
  if(ctx.lw.k==="night"||ctx.lw.k==="dawn"||ctx.lw.k==="dusk") return null;
  let s = 13;
  if(ctx.fs.k==="verylow") s+=8;
  if(ctx.clarity.n>=4) s+=6;
  if(ctx.lw.k==="midday"||ctx.lw.k==="afternoon") s+=8;   // overhead sun is what lets you see
  if(ctx.sky==="bright") s+=7;
  if(ctx.sky==="overcast") s-=8;
  if(ctx.w.size<=2) s+=5;
  if(ctx.w.type==="limestone") s+=6;
  if(ctx.w.char==="flat") s+=4;
  if(ctx.temp>70) s-=10;
  return {
    score:s,
    title:"Hunt single fish in low, clear water",
    technique:"Sight fishing — one fish at a time",
