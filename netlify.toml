# Riffle — static single-file site, no build step.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# The app is one self-contained page with no client-side router, so any
# unknown path is served the same document rather than Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html carries the whole app, so it must never be served stale.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation is (self): "Use my location" and "Near me" are the page's
    # own features, so denying it outright broke them on the deploy while
    # they kept working locally. Nothing else here is used, so nothing else
    # is allowed, and no third-party frame inherits any of it.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), interest-cohort=()"
    # Scripts and styles are inline in index.html, plus Leaflet from cdnjs.
    # The page reaches out to: Google Fonts, USGS (gauges), Open-Meteo
    # (pressure), Nominatim (geocoding), Overpass (access points), and
    # openstreetmap.org for map tiles.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://waterservices.usgs.gov https://api.open-meteo.com https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.kumi.systems; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
