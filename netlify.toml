# Riffle — static single-file site, no build step.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# The app is one self-contained page with no client-side router, so any
# unknown path is served the same document rather than Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# index.html carries the whole app, so it must never be served stale.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # geolocation=(self): the "Use my location" button is the app's own
    # feature. An empty allowlist here disables it for this document too,
    # which silently broke the button on the deployed site.
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), interest-cohort=()"
    # The app's own script is allowed by the hash of that exact script and
    # nothing else, so an injection through the world-writable OSM data the
    # app reads cannot execute. `npm run seal` in test/ regenerates it and
    # `npm test` fails if it has drifted. style-src keeps 'unsafe-inline'
    # because the page styles elements by attribute, which no hash covers.
    # Styles are inline in index.html, plus Leaflet from cdnjs.
    # The page reaches out to: Google Fonts, USGS (gauges), Open-Meteo
    # (pressure), Nominatim (geocoding), Overpass (access points and fly
    # shops), and
    # openstreetmap.org for map tiles.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-vBDDonSh9YjIHxfK1QZqcrJxVbz0tYBG4Fdqxqe2nC4=' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://waterservices.usgs.gov https://api.open-meteo.com https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.kumi.systems; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
